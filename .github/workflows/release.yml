name: Release

# Publishes when the `release` branch is updated (fast-forward main -> release):
#   - one self-contained PyInstaller binary per platform, wrapped as an npm
#     sub-package (guscatalano-ai-proxy-<platform>) and published to npm
#   - the main npm launcher package (guscatalano-ai-proxy)
#   - the Python sdist+wheel to PyPI
#   - a GitHub Release (tag vX.Y.Z) with the raw binaries attached
#
# The published version is read from the committed sources (ai_proxy/_version.py and
# npm/ai-proxy/package.json, which must match). Bump with scripts/bump_version.py on
# main, then merge main -> release. Publishing is idempotent: re-running without a
# version bump skips already-published artifacts, so re-triggering is safe.
#
# Required repo secrets:
#   NPM_TOKEN        - npm automation token with publish rights
#   PYPI_API_TOKEN   - PyPI API token (username is __token__)

on:
  push:
    branches:
      - "release"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          # Version is single-sourced in the committed files; Python and npm must match.
          PYVER=$(sed -n 's/^__version__ *= *"\(.*\)"/\1/p' ai_proxy/_version.py)
          NPMVER=$(node -p "require('./npm/ai-proxy/package.json').version")
          if [ "$PYVER" != "$NPMVER" ]; then
            echo "::error::version drift: ai_proxy/_version.py=$PYVER but npm package.json=$NPMVER."
            echo "::error::Run 'python scripts/bump_version.py <version>' to resync, then merge to release."
            exit 1
          fi
          echo "version=$PYVER" >> "$GITHUB_OUTPUT"
          echo "Releasing version $PYVER"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            key: win32-x64
          - os: macos-14
            key: darwin-arm64
          - os: ubuntu-latest
            key: linux-x64
          # Free public ARM runner for Linux arm64. Drop this entry if unavailable.
          - os: ubuntu-24.04-arm
            key: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install app + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Freeze binary
        run: pyinstaller packaging/ai_proxy.spec --distpath dist/bin --workpath build/pyi --noconfirm

      - name: Assemble platform npm package
        shell: bash
        run: |
          BIN="dist/bin/ai-proxy"
          [ "${{ matrix.key }}" = "win32-x64" ] && BIN="dist/bin/ai-proxy.exe"
          node npm/build-platform-package.js "${{ matrix.key }}" "$BIN" "out/${{ matrix.key }}" "${{ needs.version.outputs.version }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.key }}
          path: out/${{ matrix.key }}
          if-no-files-found: error

      - name: Upload raw binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.key }}
          path: dist/bin/*

  publish-npm:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: out

      - name: Publish platform packages (skip already-published)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set — skipping npm publish"; exit 0; fi
          for dir in out/pkg-*; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "skip: $name@$VERSION already published"
            else
              echo "publishing $name@$VERSION"
              # "./$dir", not "$dir": npm resolves a bare `foo/bar` argument as the
              # GitHub owner/repo shorthand and tries to clone it, instead of
              # publishing the local directory.
              npm publish --access public "./$dir"
            fi
          done

      - name: Publish main launcher package (skip if already published)
        # Version + optionalDependencies are already correct in the committed
        # package.json (verified by the `version` job).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set — skipping npm publish"; exit 0; fi
          if npm view "guscatalano-ai-proxy@$VERSION" version >/dev/null 2>&1; then
            echo "skip: guscatalano-ai-proxy@$VERSION already published"
          else
            npm publish --access public ./npm/ai-proxy
          fi

  publish-pypi:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        # Version comes from ai_proxy/_version.py via pyproject dynamic metadata
        # (Python/npm match verified by the `version` job).
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Publish to PyPI (skip if already uploaded / no token)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then echo "PYPI_API_TOKEN not set — skipping PyPI publish"; exit 0; fi
          python -m twine upload --skip-existing dist/*

  windows-installers:
    # Build the MSI (attached to the release) and the MSIX (a workflow artifact for
    # Microsoft Store submission) from the frozen win32-x64 binary.
    needs: [version, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download win32-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: bin-win32-x64
          path: dist/bin
      - name: Build MSI (WiX)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix build packaging/windows/msi/ai-proxy.wxs -bindpath dist/bin `
            -d Version=${{ needs.version.outputs.version }} `
            -o dist/ai-proxy-${{ needs.version.outputs.version }}.msi
      - name: Build MSIX (unsigned, for Store submission)
        shell: pwsh
        run: |
          pwsh packaging/windows/msix/build-msix.ps1 `
            -Version ${{ needs.version.outputs.version }} -BinDir dist/bin `
            -OutFile dist/ai-proxy-${{ needs.version.outputs.version }}.msix
      - name: Upload MSI (for the GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: installer-msi
          path: dist/*.msi
          if-no-files-found: error
      - name: Upload MSIX (Store submission artifact)
        uses: actions/upload-artifact@v4
        with:
          name: installer-msix
          path: dist/*.msix
          if-no-files-found: error

  github-release:
    needs: [version, build, windows-installers]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins
      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: installer-msi
          path: msi
      - name: Assemble release files
        run: |
          mkdir -p release
          for dir in bins/bin-*; do
            key="${dir#bins/bin-}"
            for f in "$dir"/*; do
              base="$(basename "$f")"
              if [ "$base" = "ai-proxy.exe" ]; then
                cp "$f" "release/ai-proxy-${key}.exe"
              else
                cp "$f" "release/ai-proxy-${key}"
              fi
            done
          done
          cp msi/*.msi release/ 2>/dev/null || true
      - name: Create/update GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: release/*
          fail_on_unmatched_files: true

  publish-store:
    # Publish the MSIX to the Microsoft Store (product 9N00C9KJPXT2) via the shared
    # reusable workflow. Requires the first submission to have been completed once
    # manually in Partner Center; listing text lives in store/listing.en-us.json.
    needs: windows-installers
    uses: guscatalano/store-publish/.github/workflows/publish.yml@main
    with:
      product-id: 9N00C9KJPXT2
      package-artifact: installer-msix
    secrets: inherit
