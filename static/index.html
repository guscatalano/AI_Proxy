<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Proxy</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font: 13px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; margin: 0; background: #0f1116; color: #e6e6e6; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 8px 14px; background: #1a1d26; border-bottom: 1px solid #2a2e3a; display: flex; gap: 12px; align-items: center; flex: 0 0 auto; }
  header h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: 0.5px; }
  .tabs { display: flex; gap: 2px; }
  .tab { background: #2a2e3a; color: #aaa; border: 1px solid #3a3e4a; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .tab.active { background: #3a4a6a; color: #e6e6e6; border-color: #4a5a7a; }
  header .meta { color: #888; font-size: 12px; }
  header .meta code { background: #2a2e3a; padding: 1px 6px; border-radius: 3px; color: #d8dee9; }
  header button { background: #2a2e3a; color: #e6e6e6; border: 1px solid #3a3e4a; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  header button:hover { background: #3a3e4a; }
  header label { color: #888; font-size: 12px; user-select: none; cursor: pointer; }
  #main { display: flex; flex: 1; min-height: 0; }
  #list { width: 48%; min-width: 320px; overflow: auto; border-right: 1px solid #2a2e3a; }
  table { width: 100%; border-collapse: collapse; }
  thead th { position: sticky; top: 0; background: #1a1d26; color: #aaa; font-weight: normal; font-size: 11px; text-align: left; padding: 6px 8px; border-bottom: 1px solid #2a2e3a; text-transform: uppercase; letter-spacing: 0.5px; z-index: 1; }
  tbody td { padding: 5px 8px; border-bottom: 1px solid #1f232c; font-size: 12px; vertical-align: top; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #161922; }
  tbody tr.selected td { background: #243049; }
  td.path { font-family: ui-monospace, "SF Mono", Consolas, monospace; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.method { font-weight: 600; color: #88c0d0; }
  td.ms, td.num { text-align: right; color: #888; font-variant-numeric: tabular-nums; }
  #stats { flex: 1; overflow: auto; padding: 18px; display: none; }
  #stats.show { display: block; }
  #main.stats #list, #main.stats #detail { display: none; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .card { background: #1a1d26; border: 1px solid #2a2e3a; border-radius: 6px; padding: 12px 14px; }
  .card .l { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.6px; }
  .card .v { font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .s { font-size: 11px; color: #888; margin-top: 2px; }
  .stats-section { margin-bottom: 22px; }
  .stats-section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin: 0 0 8px 0; font-weight: 600; }
  .stats-section table { background: #1a1d26; border: 1px solid #2a2e3a; border-radius: 6px; overflow: hidden; }
  .stats-section th { text-transform: uppercase; letter-spacing: 0.5px; }
  .bar { display: inline-block; height: 6px; background: #4a5a7a; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  #detail { flex: 1; overflow: auto; padding: 14px 18px; }
  .summary { background: #1a1d26; border: 1px solid #2a2e3a; padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; }
  .summary .row { margin: 3px 0; }
  .summary .label { color: #888; display: inline-block; width: 80px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .section { margin-bottom: 16px; }
  .section h3 { margin: 0 0 6px 0; font-size: 11px; text-transform: uppercase; color: #aaa; letter-spacing: 1px; font-weight: 600; }
  pre { background: #1a1d26; border: 1px solid #2a2e3a; padding: 10px 12px; border-radius: 4px; overflow: auto; max-height: 480px; white-space: pre-wrap; word-break: break-word; font: 12px/1.45 ui-monospace, "SF Mono", Consolas, monospace; margin: 0; }
  .status-2 { color: #a3be8c; }
  .status-3 { color: #ebcb8b; }
  .status-4, .status-5, .status-0 { color: #bf616a; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; background: #3a4a6a; font-size: 10px; margin-left: 6px; color: #d8dee9; }
  .empty { color: #666; padding: 40px; text-align: center; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ebcb8b; margin-right: 4px; vertical-align: middle; }
  .dot.live { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }
  code { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .reconstructed { background: #1a2a1a; border-color: #2e4a2e; }
  .stream-text { white-space: pre-wrap; }
  .verdict { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .verdict.allow { background: #2e4a2e; color: #a3be8c; }
  .verdict.block { background: #4a2e2e; color: #e08080; }
  .verdict.warn { background: #4a4020; color: #ebcb8b; }
  .verdict.rewrite { background: #2e3e5a; color: #88c0d0; }
  tr.row-block td { background: #2a1818 !important; }
  tr.row-warn td { background: #2a2418 !important; }
  tr.row-rewrite td { background: #1a2030 !important; }
  #audit, #convs, #system { flex: 1; overflow: auto; padding: 18px; display: none; }
  #audit.show, #convs.show, #system.show { display: block; }
  #main.audit #list, #main.audit #detail, #main.audit #stats, #main.audit #convs, #main.audit #system { display: none; }
  #main.convs #list, #main.convs #detail, #main.convs #stats, #main.convs #audit, #main.convs #system { display: none; }
  #main.system #list, #main.system #detail, #main.system #stats, #main.system #audit, #main.system #convs { display: none; }
  .gauge { background: #1a1d26; border: 1px solid #2a2e3a; border-radius: 6px; padding: 12px 14px; }
  .gauge .l { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.6px; }
  .gauge .v { font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .gauge .s { font-size: 11px; color: #888; margin-top: 2px; }
  .gauge .bar-bg { height: 6px; background: #0f1116; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .gauge .bar-fg { height: 100%; background: linear-gradient(90deg, #5e81ac, #88c0d0); border-radius: 3px; transition: width 200ms; }
  .gauge .bar-fg.warn { background: linear-gradient(90deg, #d08770, #ebcb8b); }
  .gauge .bar-fg.crit { background: linear-gradient(90deg, #bf616a, #d08770); }
  .spark { width: 100%; height: 60px; display: block; margin-top: 8px; }
  .spark path.line { fill: none; stroke: #88c0d0; stroke-width: 1.5; }
  .spark path.fill { fill: rgba(136, 192, 208, 0.12); stroke: none; }
  .pid-list { font-size: 11px; color: #aaa; margin-top: 6px; }
  .pid-list .pid { display: inline-block; margin-right: 8px; }
  .reach-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .reach-dot.ok { background: #a3be8c; }
  .reach-dot.bad { background: #bf616a; }
  .suggestion { background: #1a1d26; border: 1px solid #2a2e3a; border-left: 3px solid #5e81ac; padding: 10px 12px; border-radius: 4px; margin-bottom: 10px; }
  .suggestion.tune { border-left-color: #ebcb8b; }
  .suggestion.perf { border-left-color: #88c0d0; }
  .suggestion.cleanup { border-left-color: #b48ead; }
  .suggestion.policy { border-left-color: #d08770; }
  .suggestion h4 { margin: 0 0 4px 0; font-size: 13px; }
  .suggestion .detail { color: #aaa; font-size: 12px; margin-bottom: 6px; }
  .suggestion pre { font-size: 11px; max-height: 150px; }
  .turn { background: #1a1d26; border: 1px solid #2a2e3a; border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; }
  .turn .turn-header { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: #888; margin-bottom: 8px; }
  .turn .turn-header strong { color: #e6e6e6; }
  .turn .msg { padding: 6px 10px; border-radius: 4px; margin: 4px 0; font-size: 12px; }
  .turn .msg.user { background: #1a2030; color: #d8dee9; }
  .turn .msg.assistant { background: #1a261a; color: #d8dee9; }
  .turn .msg.tool { background: #2a2418; color: #d8dee9; }
  .turn .msg .role { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
  #rules-editor textarea { width: 100%; min-height: 320px; background: #0f1116; color: #e6e6e6; border: 1px solid #2a2e3a; border-radius: 4px; padding: 10px 12px; font: 12px/1.45 ui-monospace, "SF Mono", Consolas, monospace; resize: vertical; }
  #rules-editor textarea.dirty { border-color: #ebcb8b; }
  #rules-editor .toolbar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  #rules-editor button { background: #2a2e3a; color: #e6e6e6; border: 1px solid #3a3e4a; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  #rules-editor button.primary { background: #3a4a6a; border-color: #4a5a7a; }
  #rules-editor button:hover { background: #3a3e4a; }
  #rules-editor .status { font-size: 12px; }
  #rules-editor .status.ok { color: #a3be8c; }
  #rules-editor .status.err { color: #bf616a; }
  .quick-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: #1a1d26; border: 1px solid #2a2e3a; border-radius: 4px; margin-right: 6px; margin-bottom: 6px; font-size: 12px; }
  details.suggestion summary span:first-child::before, #suggestions-section > summary > .caret::before { content: "▸"; }
  details[open].suggestion > summary span:first-child::before, #suggestions-section[open] > summary > .caret::before { content: "▾"; }
  details.suggestion summary span:first-child, #suggestions-section > summary > .caret { font-size: 0; }
  details.suggestion summary span:first-child::before, #suggestions-section > summary > .caret::before { font-size: 11px; color: #888; }
  details.suggestion summary::-webkit-details-marker, #suggestions-section > summary::-webkit-details-marker { display: none; }
  .gate-block { background: #2a1818; border: 1px solid #6a3030; padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; }
  .gate-warn { background: #2a2418; border: 1px solid #6a5a30; padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; }
  .gate-rewrite { background: #1a2030; border: 1px solid #3a5070; padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; }
  .gate-allow { background: #1a261a; border: 1px solid #2e4a2e; padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<header>
  <h1>AI Proxy</h1>
  <span class="meta">→ <code id="upstream">…</code></span>
  <div class="tabs">
    <button class="tab active" id="tab-req" onclick="setView('requests')">Requests</button>
    <button class="tab" id="tab-convs" onclick="setView('convs')">Conversations</button>
    <button class="tab" id="tab-system" onclick="setView('system')">System</button>
    <button class="tab" id="tab-stats" onclick="setView('stats')">Stats</button>
    <button class="tab" id="tab-audit" onclick="setView('audit')">Audit <span id="audit-badge" style="display:none;background:#bf616a;color:#fff;border-radius:8px;padding:0 5px;margin-left:4px;font-size:10px"></span></button>
  </div>
  <span style="flex:1"></span>
  <span class="meta" id="count"></span>
  <label><input type="checkbox" id="autoref" checked> auto-refresh</label>
  <button onclick="refresh()">Refresh</button>
  <button onclick="clearAll()">Clear</button>
</header>
<div id="main">
  <div id="list">
    <table>
      <thead><tr><th>Time</th><th>Client</th><th>Method</th><th>Path</th><th>Model</th><th>Status</th><th class="num">tokens</th><th class="ms">ms</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">No requests captured yet.</div>
  </div>
  <div id="detail"><div class="empty">Select a request to inspect</div></div>
  <div id="stats"></div>
  <div id="audit"></div>
  <div id="convs"></div>
  <div id="system"></div>
</div>
<script>
let selected = null;
let items = [];
let view = 'requests';
let lastDetailSig = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => (s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const num = (n) => (n == null ? '' : Number(n).toLocaleString());

function setView(v) {
  view = v;
  for (const t of ['req','stats','audit','convs','system']) {
    const b = $('tab-' + t);
    if (b) b.classList.toggle('active', v === (t === 'req' ? 'requests' : t));
  }
  for (const c of ['stats','audit','convs','system']) {
    $('main').classList.toggle(c, v === c);
    $(c).classList.toggle('show', v === c);
  }
  if (v === 'stats') loadStats();
  else if (v === 'audit') loadAudit();
  else if (v === 'convs') loadConversations();
  else if (v === 'system') loadSystem();
  else refresh();
}

async function loadInfo() {
  try {
    const d = await (await fetch('/__proxy/api/info')).json();
    $('upstream').textContent = d.upstream;
  } catch {}
}

async function refresh() {
  try {
    const d = await (await fetch('/__proxy/api/requests')).json();
    items = d.items;
    $('count').textContent = `${d.total} request${d.total === 1 ? '' : 's'}`;
    renderList();
    if (selected) {
      const still = items.find(i => i.id === selected);
      if (still) await loadDetail(selected);
    }
  } catch (e) { /* ignore transient errors */ }
}

function fmt(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString([], { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
}

function renderList() {
  $('empty').style.display = items.length ? 'none' : 'block';
  $('rows').innerHTML = items.map(it => {
    let status;
    if (it.error && !it.status) status = '<span class="status-0">ERR</span>';
    else if (!it.status) status = '<span class="dot live"></span>pending';
    else status = `<span class="status-${String(it.status)[0]}">${it.status}</span>`;
    const stream = it.is_stream ? '<span class="badge">SSE</span>' : '';
    const ms = it.duration_ms ? Math.round(it.duration_ms) : '';
    const tokens = it.total_tokens ? num(it.total_tokens) : (it.completion_tokens ? num(it.completion_tokens) : '');
    const sel = it.id === selected ? 'selected' : '';
    const ip = esc(it.client_ip || '');
    let rowCls = sel;
    let pathExtra = '';
    if (it.gate_verdict === 'block') { rowCls += ' row-block'; pathExtra = ` <span class="verdict block" title="${esc(it.gate_reason || '')}">${esc(it.gate_rule || 'BLOCK')}</span>`; }
    else if (it.gate_verdict === 'warn') { rowCls += ' row-warn'; pathExtra = ` <span class="verdict warn" title="${esc(it.gate_reason || '')}">${esc(it.gate_rule || 'WARN')}</span>`; }
    else if (it.gate_verdict === 'rewrite') { rowCls += ' row-rewrite'; pathExtra = ` <span class="verdict rewrite" title="${esc(it.gate_reason || '')}">routed</span>`; }
    return `<tr class="${rowCls}" data-id="${it.id}"><td>${fmt(it.ts)}</td><td><code style="font-size:11px">${ip}</code></td><td class="method">${esc(it.method)}</td><td class="path" title="${esc(it.path)}">${esc(it.path)}${stream}${pathExtra}</td><td>${esc(it.model || '')}</td><td>${status}</td><td class="num">${tokens}</td><td class="ms">${ms}</td></tr>`;
  }).join('');
  for (const tr of $('rows').querySelectorAll('tr')) {
    tr.onclick = () => selectItem(tr.dataset.id);
  }
}

async function selectItem(id) {
  selected = id;
  lastDetailSig = null;  // force re-render for newly opened item
  renderList();
  await loadDetail(id);
}

function tryPretty(s) {
  if (!s) return '';
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; }
}

function renderSSE(s) {
  if (!s) return '';
  const out = [];
  for (const line of s.split('\n')) {
    if (line.startsWith('data: ')) {
      const data = line.slice(6);
      if (data === '[DONE]' || data.trim() === '') { out.push(line); continue; }
      try { out.push('data: ' + JSON.stringify(JSON.parse(data), null, 2)); } catch { out.push(line); }
    } else {
      out.push(line);
    }
  }
  return out.join('\n');
}

// Reconstruct assistant text from SSE stream chunks (OpenAI chat.completion.chunk format)
// Parse a request body and return a structured summary for the analysis panel.
function analyzeRequest(bodyText) {
  if (!bodyText) return null;
  let j; try { j = JSON.parse(bodyText); } catch { return null; }
  if (!j || typeof j !== 'object') return null;

  const params = {};
  for (const k of ['temperature','top_p','top_k','max_tokens','max_completion_tokens','seed','presence_penalty','frequency_penalty','stream','response_format','tool_choice','reasoning_effort']) {
    if (j[k] !== undefined) params[k] = j[k];
  }
  if (j.options && typeof j.options === 'object') params.options = j.options;

  const roles = {};
  const messages = j.messages || [];
  let lastUser = null, lastSystem = null, toolResults = [];
  for (const m of messages) {
    const role = m.role || 'unknown';
    const content = typeof m.content === 'string' ? m.content : (m.content == null ? '' : JSON.stringify(m.content));
    roles[role] = roles[role] || { count: 0, chars: 0 };
    roles[role].count += 1;
    roles[role].chars += content.length;
    if (role === 'user') lastUser = content;
    if (role === 'system') lastSystem = content;
    if (role === 'tool') toolResults.push({ name: m.name || m.tool_call_id || '?', content });
    if (role === 'assistant' && m.tool_calls) {
      roles.assistant.tool_calls = (roles.assistant.tool_calls || 0) + m.tool_calls.length;
    }
  }

  // Ollama /api/generate uses a flat "prompt" string.
  if (!messages.length && typeof j.prompt === 'string') {
    roles.prompt = { count: 1, chars: j.prompt.length };
    lastUser = j.prompt;
  }

  const tools = (j.tools || []).map(t => {
    const fn = t.function || t;
    return { name: fn.name || '?', description: fn.description || '', params: fn.parameters || null };
  });

  return { params, roles, messages: messages.length, lastUser, lastSystem, toolResults, tools };
}

// Walk a response body or SSE stream and extract finish reason + invoked tool calls + assistant content length.
function analyzeResponse(respBody, streamChunks) {
  const out = { finish_reason: null, tool_calls: [], content_chars: 0, content: '' };

  function fromObj(j) {
    if (!j || typeof j !== 'object') return;
    const choices = j.choices || [];
    for (const c of choices) {
      if (c.finish_reason) out.finish_reason = c.finish_reason;
      const msg = c.message || c.delta || {};
      if (typeof msg.content === 'string') out.content += msg.content;
      for (const tc of (msg.tool_calls || [])) {
        const fn = tc.function || {};
        out.tool_calls.push({ name: fn.name || '?', arguments: fn.arguments || '' });
      }
    }
    // Ollama native shape
    if (j.message && typeof j.message === 'object') {
      if (typeof j.message.content === 'string') out.content += j.message.content;
      for (const tc of (j.message.tool_calls || [])) {
        const fn = tc.function || {};
        out.tool_calls.push({ name: fn.name || '?', arguments: fn.arguments ? JSON.stringify(fn.arguments) : '' });
      }
    }
    if (j.done_reason) out.finish_reason = out.finish_reason || j.done_reason;
  }

  if (respBody) { try { fromObj(JSON.parse(respBody)); } catch {} }

  if (streamChunks) {
    // Streaming tool calls: name appears once per index, arguments accumulate as a string.
    const tcByIdx = {};
    for (const line of streamChunks.split('\n')) {
      let data = null;
      if (line.startsWith('data: ')) data = line.slice(6);
      else if (line.trim().startsWith('{')) data = line.trim();
      if (!data || data === '[DONE]') continue;
      let j; try { j = JSON.parse(data); } catch { continue; }
      for (const c of j.choices || []) {
        if (c.finish_reason) out.finish_reason = c.finish_reason;
        const delta = c.delta || c.message || {};
        if (typeof delta.content === 'string') out.content += delta.content;
        for (const tc of (delta.tool_calls || [])) {
          const idx = tc.index ?? Object.keys(tcByIdx).length;
          const slot = tcByIdx[idx] = tcByIdx[idx] || { name: '', arguments: '' };
          const fn = tc.function || {};
          if (fn.name) slot.name = fn.name;
          if (fn.arguments) slot.arguments += fn.arguments;
        }
      }
      if (j.done_reason) out.finish_reason = out.finish_reason || j.done_reason;
      if (j.message && j.message.tool_calls) {
        for (const tc of j.message.tool_calls) {
          const fn = tc.function || {};
          out.tool_calls.push({ name: fn.name || '?', arguments: fn.arguments ? JSON.stringify(fn.arguments) : '' });
        }
      }
    }
    for (const k of Object.keys(tcByIdx)) out.tool_calls.push(tcByIdx[k]);
  }

  out.content_chars = out.content.length;
  return out;
}

function renderAnalysis(d) {
  const req = analyzeRequest(d.request_body);
  const resp = analyzeResponse(d.response_body, d.stream_chunks);
  if (!req && (!resp.tool_calls.length && !resp.finish_reason && !resp.content_chars)) return '';

  let reqHtml = '';
  if (req) {
    const paramsRows = Object.entries(req.params).map(([k, v]) =>
      `<tr><td><code>${esc(k)}</code></td><td><code>${esc(typeof v === 'object' ? JSON.stringify(v) : String(v))}</code></td></tr>`
    ).join('') || '<tr><td colspan="2" style="color:#666">(none)</td></tr>';

    const roleRows = Object.entries(req.roles).map(([role, info]) => {
      const extra = info.tool_calls ? ` · ${info.tool_calls} tool_call${info.tool_calls === 1 ? '' : 's'}` : '';
      return `<tr><td>${esc(role)}</td><td class="num">${num(info.count)}</td><td class="num">${num(info.chars)}${extra}</td></tr>`;
    }).join('');

    const userPreview = req.lastUser ? `<div class="section"><h3>Latest User Message (${num(req.lastUser.length)} chars)</h3><pre data-k="lastuser" style="max-height:240px">${esc(req.lastUser.slice(0, 4000))}${req.lastUser.length > 4000 ? '\n…' : ''}</pre></div>` : '';
    const sysPreview = req.lastSystem ? `<div class="section"><h3>System Message (${num(req.lastSystem.length)} chars)</h3><pre data-k="sys" style="max-height:200px">${esc(req.lastSystem.slice(0, 2000))}${req.lastSystem.length > 2000 ? '\n…' : ''}</pre></div>` : '';

    const toolList = req.tools.length ? `
      <div class="section"><h3>Tools Defined (${req.tools.length})</h3>
        <table style="width:100%"><thead><tr><th>Name</th><th>Description</th></tr></thead>
        <tbody>${req.tools.map(t => `<tr><td><code>${esc(t.name)}</code></td><td style="color:#aaa">${esc((t.description || '').slice(0, 200))}</td></tr>`).join('')}</tbody></table>
      </div>` : '';

    const toolResultsHtml = req.toolResults.length ? `
      <div class="section"><h3>Tool Results In Request (${req.toolResults.length})</h3>
        ${req.toolResults.map(t => `<details style="margin-bottom:6px"><summary><code>${esc(t.name)}</code> · ${num(t.content.length)} chars</summary><pre data-k="tr-${esc(t.name)}" style="max-height:200px">${esc(t.content.slice(0, 4000))}</pre></details>`).join('')}
      </div>` : '';

    reqHtml = `
      <div class="section"><h3>Sampling Params</h3>
        <table style="width:auto;min-width:280px"><tbody>${paramsRows}</tbody></table>
      </div>
      <div class="section"><h3>Messages (${num(req.messages)})</h3>
        <table style="width:auto;min-width:340px"><thead><tr><th>Role</th><th class="num">Count</th><th class="num">Chars</th></tr></thead><tbody>${roleRows}</tbody></table>
      </div>
      ${sysPreview}${userPreview}${toolList}${toolResultsHtml}
    `;
  }

  let respHtml = '';
  if (resp.finish_reason || resp.tool_calls.length || resp.content_chars) {
    const tcRows = resp.tool_calls.map(t => {
      let argPretty = t.arguments;
      try { argPretty = JSON.stringify(JSON.parse(t.arguments), null, 2); } catch {}
      return `<details style="margin-bottom:6px"><summary><code>${esc(t.name)}</code> · ${num((t.arguments || '').length)} char args</summary><pre data-k="tc-${esc(t.name)}" style="max-height:240px">${esc(argPretty)}</pre></details>`;
    }).join('') || '<div style="color:#666">(none)</div>';
    respHtml = `
      <div class="section"><h3>Response Analysis</h3>
        <div>finish_reason: <code>${esc(resp.finish_reason || '—')}</code> · assistant content: ${num(resp.content_chars)} chars · ${resp.tool_calls.length} tool call${resp.tool_calls.length === 1 ? '' : 's'}</div>
      </div>
      ${resp.tool_calls.length ? `<div class="section"><h3>Tool Calls Invoked</h3>${tcRows}</div>` : ''}
    `;
  }

  return reqHtml + respHtml;
}

function reconstructStream(s) {
  if (!s) return '';
  const parts = [];
  for (const line of s.split('\n')) {
    if (!line.startsWith('data: ')) continue;
    const data = line.slice(6);
    if (data === '[DONE]') continue;
    try {
      const j = JSON.parse(data);
      const c = j.choices && j.choices[0];
      if (!c) continue;
      const delta = c.delta || c.message || {};
      if (delta.content) parts.push(delta.content);
    } catch {}
  }
  return parts.join('');
}

async function loadDetail(id) {
  const r = await fetch('/__proxy/api/requests/' + id);
  if (!r.ok) { $('detail').innerHTML = '<div class="empty">not found</div>'; lastDetailSig = null; return; }
  const d = await r.json();

  // Skip re-render if nothing the user can see has changed; preserves scroll position during auto-refresh.
  const sig = [
    d.id, d.status, d.error || '',
    (d.response_body || '').length,
    (d.stream_chunks || '').length,
    d.duration_ms || 0,
    d.total_tokens || 0,
  ].join('|');
  if (sig === lastDetailSig) return;

  // Capture scroll positions before re-render so the user doesn't get yanked to the top.
  const detailEl = $('detail');
  const prevScroll = detailEl.scrollTop;
  const preScrolls = {};
  detailEl.querySelectorAll('pre').forEach(p => {
    if (p.dataset.k) preScrolls[p.dataset.k] = { top: p.scrollTop, left: p.scrollLeft };
  });

  const reqHeaders = tryPretty(d.request_headers);
  const reqBody = tryPretty(d.request_body);
  const respHeaders = tryPretty(d.response_headers);
  let respSection = '';

  if (d.is_stream || d.stream_chunks) {
    const reconstructed = reconstructStream(d.stream_chunks || '');
    respSection = `
      ${reconstructed ? `<div class="section"><h3>Reconstructed Assistant Output</h3><pre class="reconstructed stream-text" data-k="reconstructed">${esc(reconstructed)}</pre></div>` : ''}
      <div class="section"><h3>Stream Chunks (SSE)</h3><pre data-k="stream">${esc(renderSSE(d.stream_chunks || ''))}</pre></div>
    `;
  } else {
    respSection = `<div class="section"><h3>Response Body</h3><pre data-k="resp">${esc(tryPretty(d.response_body))}</pre></div>`;
  }

  const errBlock = d.error ? `<div class="section"><h3>Error</h3><pre class="status-5" data-k="err">${esc(d.error)}</pre></div>` : '';
  const status = d.status || (d.error ? 'ERR' : 'pending');

  const tokensLine = (d.prompt_tokens != null || d.completion_tokens != null || d.total_tokens != null)
    ? `<div class="row"><span class="label">Tokens</span> prompt: <code>${num(d.prompt_tokens) || '—'}</code> · completion: <code>${num(d.completion_tokens) || '—'}</code> · total: <code>${num(d.total_tokens) || '—'}</code></div>`
    : '';

  const analysisHtml = renderAnalysis(d);

  let gateHtml = '';
  if (d.gate_verdict === 'block' || d.gate_verdict === 'warn' || d.gate_verdict === 'rewrite') {
    let detailsBlock = '';
    let parsed = null;
    if (d.gate_details) {
      try { parsed = JSON.parse(d.gate_details); } catch {}
      const pretty = parsed ? JSON.stringify(parsed, null, 2) : d.gate_details;
      detailsBlock = `<pre data-k="gate-details" style="margin-top:8px;max-height:200px">${esc(pretty)}</pre>`;
    }
    let routedLine = '';
    if (parsed && parsed.rewrite) {
      const r = parsed.rewrite;
      routedLine = `<div style="margin-top:6px;font-size:14px"><code>${esc(r.from)}</code> &nbsp;→&nbsp; <code style="color:#88c0d0">${esc(r.to)}</code> <span class="badge">via ${esc(r.via || '')}</span></div>`;
    }
    const cls = d.gate_verdict === 'block' ? 'gate-block' : (d.gate_verdict === 'warn' ? 'gate-warn' : 'gate-rewrite');
    gateHtml = `<div class="${cls}">
      <div><span class="verdict ${d.gate_verdict}">${esc(d.gate_verdict)}</span> · rule: <code>${esc(d.gate_rule || '')}</code></div>
      <div style="margin-top:6px">${esc(d.gate_reason || '')}</div>
      ${routedLine}
      ${detailsBlock}
    </div>`;
  } else if (d.gate_verdict === 'allow') {
    gateHtml = `<div class="gate-allow"><span class="verdict allow">allow</span> · no rule fired</div>`;
  }

  detailEl.innerHTML = `
    <div class="summary">
      <div class="row"><span class="label">Request</span> <strong class="method">${esc(d.method)}</strong> <code>${esc(d.path)}</code></div>
      <div class="row"><span class="label">Client</span> <code>${esc(d.client_ip || '(unknown)')}</code></div>
      <div class="row"><span class="label">Upstream</span> <code>${esc(d.upstream_url)}</code></div>
      <div class="row"><span class="label">Status</span> <span class="status-${String(status)[0]}">${esc(status)}</span> · ${d.duration_ms ? Math.round(d.duration_ms) + ' ms' : '—'}${d.is_stream ? ' · <span class="badge">SSE</span>' : ''}</div>
      <div class="row"><span class="label">Model</span> <code>${esc(d.model || '(none)')}</code></div>
      ${tokensLine}
    </div>
    ${gateHtml}
    ${errBlock}
    ${analysisHtml}
    <div class="section"><h3>Request Headers</h3><details><summary style="cursor:pointer;color:#888;font-size:11px">show</summary><pre data-k="reqh">${esc(reqHeaders)}</pre></details></div>
    <div class="section"><h3>Request Body (raw)</h3><details open><summary style="cursor:pointer;color:#888;font-size:11px">hide</summary><pre data-k="reqb">${esc(reqBody)}</pre></details></div>
    <div class="section"><h3>Response Headers</h3><details><summary style="cursor:pointer;color:#888;font-size:11px">show</summary><pre data-k="resph">${esc(respHeaders)}</pre></details></div>
    ${respSection}
  `;

  // Restore scroll positions.
  detailEl.scrollTop = prevScroll;
  detailEl.querySelectorAll('pre').forEach(p => {
    const s = p.dataset.k && preScrolls[p.dataset.k];
    if (s) { p.scrollTop = s.top; p.scrollLeft = s.left; }
  });

  lastDetailSig = sig;
}

async function clearAll() {
  if (!confirm('Clear all captured requests?')) return;
  await fetch('/__proxy/api/clear', { method: 'POST' });
  selected = null;
  lastDetailSig = null;
  $('detail').innerHTML = '<div class="empty">Select a request to inspect</div>';
  await refresh();
  if (view === 'stats') await loadStats();
}

async function loadStats() {
  const d = await (await fetch('/__proxy/api/stats')).json();
  const o = d.overall || {};
  const span = (o.first_ts && o.last_ts) ? Math.max(1, o.last_ts - o.first_ts) : 0;
  const cards = `
    <div class="cards">
      <div class="card"><div class="l">Requests</div><div class="v">${num(o.count || 0)}</div><div class="s">${num(o.errors || 0)} errors · ${num(o.streams || 0)} streamed</div></div>
      <div class="card"><div class="l">Total Tokens</div><div class="v">${num(o.total_tokens || 0)}</div><div class="s">prompt ${num(o.prompt_tokens || 0)} · completion ${num(o.completion_tokens || 0)}</div></div>

  const modelRows = d.by_model.length ? d.by_model.map(m => {
    const w = Math.round(80 * (m.total_tokens || 0) / maxModelTokens);
    const tokensPerSec = m.total_ms > 0 ? ((m.completion_tokens || 0) / (m.total_ms / 1000)).toFixed(1) : '—';

      <td><code>${esc(m.model)}</code></td>

      <td class="num">${num(m.prompt_tokens)}</td>

  const pathRows = d.by_path.length ? d.by_path.map(p => `
    <tr><td><code>${esc(p.path)}</code></td><td class="num">${num(p.count)}</td><td class="num">${num(p.total_tokens)}</td><td class="num">${Math.round(p.avg_ms || 0)}</td></tr>
  `).join('') : '<tr><td colspan="4" class="empty">No data yet</td></tr>';

  const statusRows = d.by_status.length ? d.by_status.map(s => {
    const code = s.status || 'ERR';
    return `<tr><td><span class="status-${String(code)[0]}">${esc(code)}</span></td><td class="num">${num(s.count)}</td></tr>`;
  }).join('') : '<tr><td colspan="2" class="empty">No data yet</td></tr>';

  const clients = d.by_client || [];
  const clientRows = clients.length ? clients.map(c => `
    <tr><td><code>${esc(c.client_ip)}</code></td><td class="num">${num(c.count)}</td><td class="num">${num(c.total_tokens)}</td><td class="num">${Math.round(c.avg_ms || 0)}</td><td style="color:#888;font-size:11px">${c.last_ts ? new Date(c.last_ts*1000).toLocaleString() : ''}</td></tr>
  `).join('') : '<tr><td colspan="5" class="empty">No data yet</td></tr>';

  const tools = d.by_tool || [];
  const toolRows = tools.length ? tools.map(t => {
    const byModel = Object.entries(t.by_model || {}).map(([m, n]) => `<code style="font-size:11px">${esc(m)}</code>:${num(n)}`).join(' · ') || '—';
    return `<tr><td><code>${esc(t.name)}</code></td><td class="num">${num(t.calls)}</td><td>${byModel}</td></tr>`;
  }).join('') : '<tr><td colspan="3" class="empty">No tool calls observed yet</td></tr>';

  $('stats').innerHTML = `
    ${cards}
    <div class="stats-section">
      <h2>By Model</h2>
      <table style="width:100%">
        <thead><tr><th>Model</th><th class="num">Requests</th><th class="num">Prompt</th><th class="num">Completion</th><th class="num">Total Tokens</th><th class="num">Avg ms</th><th class="num">tok/s</th><th class="num">Errors</th></tr></thead>
        <tbody>${modelRows}</tbody>
      </table>
    </div>
    <div class="stats-section">

      <table style="width:100%">

        <tbody>${clientRows}</tbody>

    </div>
    <div class="stats-section">
      <h2>Tool Usage</h2>
      <table style="width:100%">
        <thead><tr><th>Tool</th><th class="num">Calls</th><th>By Model</th></tr></thead>

    <div class="stats-section">
      <h2>By Status</h2>
      <table style="width:auto;min-width:240px">
        <thead><tr><th>Status</th><th class="num">Count</th></tr></thead>
        <tbody>${statusRows}</tbody>
      </table>

  `;
}

async function loadAudit() {
  // Preserve any in-progress edit in the rules textarea across the rebuild.
  const prevTa = $('rules-json');
  const wasDirty = prevTa && prevTa.classList.contains('dirty');
  const dirtyValue = wasDirty ? prevTa.value : null;

  const [a, r, s] = await Promise.all([
    fetch('/__proxy/api/audit?include_allow=false').then(x => x.json()),
    fetch('/__proxy/api/rules').then(x => x.json()).catch(() => ({})),
    fetch('/__proxy/api/suggestions').then(x => x.json()).catch(() => ({ items: [] })),
  ]);
  const counts = a.counts || {};
  const blocks = counts.block || 0;
  const warns = counts.warn || 0;
  const allows = counts.allow || 0;
  const rewrites = counts.rewrite || 0;

  const rulesCfg = r.config || {};
  const ruleRows = (r.registered || []).map(name => {
    const c = rulesCfg[name] || {};
    return `<tr><td><code>${esc(name)}</code></td><td>${c.enabled ? '<span class="verdict allow">on</span>' : '<span style="color:#666">off</span>'}</td><td>${esc(c.action || '')}</td><td><code style="font-size:11px">${esc(JSON.stringify({ ...c, enabled: undefined, action: undefined }))}</code></td></tr>`;
  }).join('') || '<tr><td colspan="4" class="empty">No rules registered</td></tr>';

  const quickToggles = (r.registered || []).map(name => {
    const c = rulesCfg[name] || {};
    const id = 'qt-' + name.replace(/[^a-z0-9]/gi, '');
    return `<label class="quick-toggle"><input type="checkbox" id="${id}" ${c.enabled ? 'checked' : ''} onchange="toggleRule('${esc(name)}', this.checked)"> <code>${esc(name)}</code></label>`;
  }).join('');

  const auditRows = (a.items || []).map(it => {
    let detailsPretty = '';
    if (it.gate_details) {
      try { detailsPretty = JSON.stringify(JSON.parse(it.gate_details), null, 2); } catch { detailsPretty = it.gate_details; }
    }
    return `<tr style="cursor:pointer" data-id="${esc(it.id)}">

      <td><span class="verdict ${esc(it.gate_verdict)}">${esc(it.gate_verdict)}</span></td>
      <td><code>${esc(it.gate_rule || '')}</code></td>
      <td>${esc(it.gate_reason || '')}</td>
      <td>${esc(it.model || '')}</td>
      <td><code style="font-size:11px">${esc(it.client_ip || '')}</code></td>
      <td><code style="font-size:11px">${esc(it.path)}</code></td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" class="empty">No blocks or warnings yet</td></tr>';

  const suggItems = (s.items || []);
  const suggestionsHtml = suggItems.length ? suggItems.map(it => `
    <details class="suggestion ${esc(it.severity || '')}">
      <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px">
        <span style="color:#666;font-size:10px;width:10px">▸</span>
        <strong style="font-size:13px">${esc(it.title)}</strong>
        <span style="color:#666;font-size:10px;text-transform:uppercase;letter-spacing:0.5px">${esc(it.severity || '')}</span>
      </summary>
      <div style="margin:8px 0 0 18px">
        <div class="detail">${esc(it.detail)}</div>
        ${it.snippet ? `<details><summary style="cursor:pointer;color:#888;font-size:11px">show rules.json snippet</summary><pre>${esc(JSON.stringify(it.snippet, null, 2))}</pre></details>` : ''}
      </div>
    </details>
  `).join('') : `<div class="empty" style="padding:20px">No suggestions yet — need more traffic to find patterns (analyzed ${num(s.sample_size || 0)} requests).</div>`;

  $('audit').innerHTML = `
    <div class="cards">
      <div class="card"><div class="l">Allowed</div><div class="v" style="color:#a3be8c">${num(allows)}</div></div>
      <div class="card"><div class="l">Rewrites</div><div class="v" style="color:#88c0d0">${num(rewrites)}</div></div>
      <div class="card"><div class="l">Warnings</div><div class="v" style="color:#ebcb8b">${num(warns)}</div></div>
      <div class="card"><div class="l">Blocks</div><div class="v" style="color:#bf616a">${num(blocks)}</div></div>
      <div class="card"><div class="l">Rules File</div><div class="v" style="font-size:12px"><code>${esc((r.rules_file || '').split('/').pop())}</code></div><div class="s">${r.rules_file_exists ? 'override active' : 'using defaults'}</div></div>
    </div>
    <details class="stats-section" ${suggItems.length ? 'open' : ''} id="suggestions-section">
      <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;margin:0 0 8px 0">
        <span style="color:#888;font-size:10px;width:10px" class="caret">▾</span>

        <thead><tr><th>Rule</th><th>Enabled</th><th>Action</th><th>Config</th></tr></thead>
        <tbody>${ruleRows}</tbody>
      </table>
    </div>
    <div class="stats-section" id="rules-editor">
      <h2>Rules Editor <span style="color:#888;font-weight:normal;font-size:11px">${esc(r.source || '')}${r.updated_ts ? ' · saved ' + new Date(r.updated_ts*1000).toLocaleString() : ''}</span></h2>
      <div style="color:#888;font-size:11px;margin-bottom:6px">Stored in DB. Saves take effect on the next request — no restart needed. POST <code>{}</code> or click Reset to fall back to defaults.</div>
      <textarea id="rules-json" spellcheck="false" oninput="markRulesDirty()"></textarea>
      <div class="toolbar">
        <button class="primary" onclick="saveRules()">Save</button>
        <button onclick="reloadRules()">Reload</button>
        <button onclick="resetRules()">Reset to defaults</button>
        <span class="status" id="rules-status"></span>
      </div>
    </div>
    <div class="stats-section">
      <h2>Recent Block / Warn Events</h2>
      <table style="width:100%">
        <thead><tr><th>Time</th><th>Verdict</th><th>Rule</th><th>Reason</th><th>Model</th><th>Client</th><th>Path</th></tr></thead>
        <tbody>${auditRows}</tbody>
      </table>
    </div>
  `;
  for (const tr of $('audit').querySelectorAll('tbody tr[data-id]')) {
    tr.onclick = () => { setView('requests'); selectItem(tr.dataset.id); };
  }

  // Populate the Rules Editor textarea with what's actually persisted (or the effective config if nothing is stored).
  // If the user was mid-edit, restore their unsaved value rather than clobbering it.
  const ta = $('rules-json');
  if (ta) {
    const serverText = JSON.stringify(r.stored ?? r.config, null, 2);
    rulesEditorBaseline = serverText;
    if (dirtyValue !== null) {
      ta.value = dirtyValue;
      ta.classList.add('dirty');
    } else {
      ta.value = serverText;
      ta.classList.remove('dirty');
    }
  }
}

      <td><code style="font-size:11px">${esc(c.conversation_id)}</code></td>
      <td class="num">${num(c.turns)}</td>
      <td class="num">${num(c.total_tokens)}</td>
      <td>${esc((c.models || '').split(',').slice(0,3).join(', '))}</td>
      <td><code style="font-size:11px">${esc((c.clients || '').split(',')[0] || '')}</code></td>
      <td>${span}</td>
      <td style="color:#aaa;font-size:11px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.preview || '')}</td>
    </tr>`;
  }).join('');

  $('convs').innerHTML = `
    <div class="stats-section">
      <h2>Conversations</h2>
      <table style="width:100%">
        <thead><tr><th>Last seen</th><th>ID</th><th class="num">Turns</th><th class="num">Tokens</th><th>Models</th><th>Client</th><th>Span</th><th>First user message</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div id="conv-detail"></div>
  `;
  for (const tr of $('convs').querySelectorAll('tbody tr[data-cid]')) {
    tr.onclick = () => loadConversationDetail(tr.dataset.cid);
  }
}

async function loadConversationDetail(cid) {
  const d = await (await fetch('/__proxy/api/conversations/' + encodeURIComponent(cid))).json();
  const turns = d.turns || [];
  const turnHtml = turns.map((t, i) => {
    let body = null;
    try { body = JSON.parse(t.request_body || ''); } catch {}
    const userMsgs = (body && body.messages || []).filter(m => m && m.role === 'user');
    const lastUser = userMsgs[userMsgs.length - 1];
    const userText = lastUser ? (typeof lastUser.content === 'string' ? lastUser.content : JSON.stringify(lastUser.content)) : '';

    // Assistant: prefer reconstructed stream, else parse response_body.
    let assistantText = '';
    let toolCalls = [];
    if (t.stream_chunks) {
      assistantText = reconstructStream(t.stream_chunks);
      const a = analyzeResponse(null, t.stream_chunks);
      toolCalls = a.tool_calls;
    } else if (t.response_body) {
      const a = analyzeResponse(t.response_body, null);
      assistantText = a.content;
      toolCalls = a.tool_calls;
    }

    // Tool result messages in this turn's request (results from prior turn's tool calls).
    const toolResults = (body && body.messages || []).filter(m => m && m.role === 'tool');

    let verdictBadge = '';
    if (t.gate_verdict && t.gate_verdict !== 'allow') {
      verdictBadge = ` <span class="verdict ${esc(t.gate_verdict)}">${esc(t.gate_verdict)}${t.gate_rule ? ' · ' + esc(t.gate_rule) : ''}</span>`;
    }

    const tcHtml = toolCalls.length ? toolCalls.map(tc => {
      let pretty = tc.arguments;
      try { pretty = JSON.stringify(JSON.parse(tc.arguments), null, 2); } catch {}
      return `<details style="margin:4px 0"><summary style="font-size:11px;cursor:pointer">🔧 <code>${esc(tc.name)}</code></summary><pre style="font-size:11px;max-height:160px">${esc(pretty)}</pre></details>`;
    }).join('') : '';

    const trHtml = toolResults.length ? toolResults.map(tr => `
      <details class="msg tool" style="margin:4px 0"><summary style="font-size:11px;cursor:pointer">tool result · <code>${esc(tr.name || tr.tool_call_id || '?')}</code></summary>
        <pre style="font-size:11px;max-height:160px;margin-top:4px">${esc(typeof tr.content === 'string' ? tr.content.slice(0, 4000) : JSON.stringify(tr.content).slice(0, 4000))}</pre>
      </details>
    `).join('') : '';

    return `<div class="turn">
      <div class="turn-header">
        <strong>Turn ${num(t.turn_index || (i + 1))}</strong>
        <span>· <a href="#" onclick="event.preventDefault();setView('requests');selectItem('${esc(t.id)}')" style="color:#88c0d0">${esc(t.id.slice(0,8))}</a></span>
        <span>· ${fmt(t.ts)}</span>
        <span>· <code>${esc(t.model || '')}</code></span>
        <span>· ${num(t.total_tokens || 0)} tok</span>
        <span>· ${Math.round(t.duration_ms || 0)}ms</span>
        ${verdictBadge}
      </div>
      ${trHtml}
      ${userText ? `<div class="msg user"><div class="role">user</div>${esc(userText.slice(0, 4000))}${userText.length > 4000 ? '\n…' : ''}</div>` : ''}
      ${assistantText ? `<div class="msg assistant"><div class="role">assistant</div>${esc(assistantText.slice(0, 4000))}${assistantText.length > 4000 ? '\n…' : ''}</div>` : ''}
      ${tcHtml}
    </div>`;
  }).join('');

  $('conv-detail').innerHTML = `
    <div class="stats-section">
      <h2>Conversation <code style="font-size:13px">${esc(cid)}</code> · ${turns.length} turn${turns.length === 1 ? '' : 's'}</h2>
      ${turnHtml}
    </div>
  `;
  $('conv-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

let rulesEditorBaseline = '';

function markRulesDirty() {
  const ta = $('rules-json');
  if (!ta) return;
  ta.classList.toggle('dirty', ta.value !== rulesEditorBaseline);
  setRulesStatus('', '');
}

function setRulesStatus(msg, kind) {
  const el = $('rules-status');
  if (!el) return;
  el.textContent = msg || '';
  el.className = 'status' + (kind ? ' ' + kind : '');
}

async function reloadRules() {
  const r = await (await fetch('/__proxy/api/rules')).json();
  const ta = $('rules-json');
  // Show what's actually stored (or current effective config if nothing stored).
  const text = JSON.stringify(r.stored ?? r.config, null, 2);
  if (ta) {
    ta.value = text;
    rulesEditorBaseline = text;
    ta.classList.remove('dirty');
  }
  setRulesStatus('Loaded from ' + (r.source || 'unknown'), 'ok');
}

async function saveRules() {
  const ta = $('rules-json');
  if (!ta) return;
  let parsed;
  try { parsed = JSON.parse(ta.value); }
  catch (e) { setRulesStatus('Invalid JSON: ' + e.message, 'err'); return; }
  if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) {
    setRulesStatus('Top-level must be a JSON object', 'err'); return;
  }
  const r = await fetch('/__proxy/api/rules', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(parsed),
  });
  if (!r.ok) {
    let msg = 'Save failed (' + r.status + ')';
    try { msg = (await r.json()).error || msg; } catch {}
    setRulesStatus(msg, 'err');
    return;
  }
  rulesEditorBaseline = ta.value;
  ta.classList.remove('dirty');
  setRulesStatus('Saved · effective immediately', 'ok');
  loadAudit();  // refresh active-rules section + suggestions
}

async function resetRules() {
  if (!confirm('Reset rules to defaults? Your saved config will be removed.')) return;
  await fetch('/__proxy/api/rules/reset', { method: 'POST' });
  await reloadRules();
  setRulesStatus('Reset to defaults', 'ok');
  loadAudit();
}

async function toggleRule(name, enabled) {
  // Quick-toggle: read current stored config, flip the enabled flag, save back.
  const r = await (await fetch('/__proxy/api/rules')).json();
  const stored = r.stored && typeof r.stored === 'object' ? r.stored : {};
  if (!stored[name] || typeof stored[name] !== 'object') stored[name] = {};
  stored[name].enabled = enabled;
  // Preserve any defaults the user hadn't overridden by merging registered rule's existing config.
  const cfg = (r.config && r.config[name]) || {};
  for (const k of Object.keys(cfg)) {
    if (!(k in stored[name])) stored[name][k] = cfg[k];
  }
  stored[name].enabled = enabled;
  await fetch('/__proxy/api/rules', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(stored),
  });
  loadAudit();
}

function sparklinePath(values, w, h) {
  // values: array of numbers (may include null). Returns {line, fill, max, min, last}.
  const clean = values.map(v => (v == null || isNaN(v)) ? null : Number(v));
  const valid = clean.filter(v => v != null);
  if (!valid.length) return { line: '', fill: '', max: 0, min: 0, last: null };
  const max = Math.max(...valid);
  const min = Math.min(...valid);
  const range = max - min || 1;
  const n = clean.length;
  const stepX = n > 1 ? w / (n - 1) : w;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const v = clean[i];
    if (v == null) continue;
    const x = i * stepX;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    pts.push([x, y]);
  }
  if (!pts.length) return { line: '', fill: '', max, min, last: null };
  let line = 'M' + pts.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' L');
  let fill = `M${pts[0][0].toFixed(1)} ${h} L` + pts.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' L') + ` L${pts[pts.length-1][0].toFixed(1)} ${h} Z`;
  return { line, fill, max, min, last: clean[clean.length - 1] };
}

function spark(values, label, unit) {
  const w = 280, h = 60;
  const sp = sparklinePath(values, w, h);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path class="fill" d="${sp.fill}"/>
    <path class="line" d="${sp.line}"/>
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:10px;color:#666">
    <span>min ${sp.min == null ? '—' : Math.round(sp.min)}${unit||''}</span>
    <span>max ${sp.max == null ? '—' : Math.round(sp.max)}${unit||''}</span>
  </div>`;
}

function barClass(pct) {
  if (pct >= 90) return 'crit';
  if (pct >= 70) return 'warn';
  return '';
}

let systemHistoryCache = null;
let systemNowCache = null;

async function loadSystem() {
  const [now, hist] = await Promise.all([
    fetch('/__proxy/api/system/now').then(r => r.json()),
    fetch('/__proxy/api/system/history?minutes=60').then(r => r.json()),
  ]);
  systemNowCache = now;
  systemHistoryCache = hist;
  renderSystem();
}

function renderSystem() {
  const now = systemNowCache;
  const hist = systemHistoryCache;
  if (!now || !hist) return;

  const samples = hist.samples || [];
  if (!now.ts) {
    $('system').innerHTML = '<div class="empty" style="padding:40px">Collecting first metrics — refresh in a few seconds…</div>';
    return;
  }

  const cpuVals = samples.map(s => s.cpu_pct);
  const memVals = samples.map(s => s.mem_used_mb && s.mem_total_mb ? (s.mem_used_mb / s.mem_total_mb * 100) : null);
  const gpuUtilVals = samples.map(s => s.gpu_util_pct);
  const gpuMemVals = samples.map(s => s.gpu_mem_used_mb && s.gpu_mem_total_mb ? (s.gpu_mem_used_mb / s.gpu_mem_total_mb * 100) : null);

  const cpu = now.cpu_pct;
  const mem = now.mem || {};
  const memPct = mem.total_mb ? (mem.used_mb / mem.total_mb * 100) : null;
  const gpus = now.gpus || [];

  const cpuCard = `<div class="gauge">
    <div class="l">CPU</div>
    <div class="v">${cpu == null ? '—' : cpu.toFixed(1)}<span style="font-size:14px;color:#888">%</span></div>
    <div class="s">load 1m: ${now.load_1m == null ? '—' : now.load_1m.toFixed(2)}</div>
    <div class="bar-bg"><div class="bar-fg ${barClass(cpu || 0)}" style="width:${cpu == null ? 0 : cpu}%"></div></div>
    ${spark(cpuVals, 'cpu', '%')}
  </div>`;

  const memCard = `<div class="gauge">
    <div class="l">Memory</div>
    <div class="v">${mem.used_mb == null ? '—' : (mem.used_mb / 1024).toFixed(1)}<span style="font-size:14px;color:#888"> / ${mem.total_mb == null ? '—' : (mem.total_mb / 1024).toFixed(1)} GB</span></div>
    <div class="s">${memPct == null ? '' : memPct.toFixed(0) + '% used · '} avail ${mem.avail_mb == null ? '—' : (mem.avail_mb / 1024).toFixed(1)} GB</div>
    <div class="bar-bg"><div class="bar-fg ${barClass(memPct || 0)}" style="width:${memPct == null ? 0 : memPct}%"></div></div>
    ${spark(memVals, 'mem', '%')}
  </div>`;

  const gpuCards = gpus.map((g, i) => {
    const util = g.util_pct;
    const memUsed = g.mem_used_mb;
    const memTotal = g.mem_total_mb;
    const gpuMemPct = (memUsed && memTotal) ? (memUsed / memTotal * 100) : null;
    const procs = (g.processes || []).slice(0, 6).map(p => `<span class="pid"><code>${esc(String(p.pid))}</code> ${esc(p.name || '')} <span style="color:#666">${num(p.mem_mb || 0)}MB</span></span>`).join('');
    const utilSpark = i === 0 ? spark(gpuUtilVals, 'gpu', '%') : '';
    return `<div class="gauge">
      <div class="l">GPU ${g.idx}: ${esc(g.name || '')}</div>
      <div class="v">${util == null ? '—' : util}<span style="font-size:14px;color:#888">% util</span> <span style="font-size:13px;color:#888">· ${g.temp_c == null ? '' : g.temp_c + '°C'}</span></div>
      <div class="s">VRAM ${memUsed == null ? '—' : (memUsed/1024).toFixed(1)} / ${memTotal == null ? '—' : (memTotal/1024).toFixed(1)} GB${gpuMemPct ? ' · ' + gpuMemPct.toFixed(0) + '%' : ''}</div>
      <div class="bar-bg"><div class="bar-fg ${barClass(gpuMemPct || 0)}" style="width:${gpuMemPct == null ? 0 : gpuMemPct}%"></div></div>
      ${utilSpark}
      ${procs ? `<div class="pid-list">${procs}</div>` : ''}
    </div>`;
  }).join('') || `<div class="gauge"><div class="l">GPU</div><div class="v" style="font-size:14px;color:#888">No NVIDIA GPU detected</div></div>`;

  const ollama = now.ollama || {};
  const lmstudio = now.lmstudio || {};

  const ollamaPs = (ollama.ps || []).map(m => `
    <tr><td><code>${esc(m.name || m.model || '')}</code></td>
        <td>${esc(m.parameter_size || '')}</td>
        <td class="num">${num(m.size_mb || 0)} MB</td>
        <td class="num">${num(m.size_vram_mb || 0)} MB</td>
        <td>${m.expires_at ? esc(new Date(m.expires_at).toLocaleTimeString()) : ''}</td></tr>
  `).join('') || '<tr><td colspan="5" class="empty" style="padding:8px">No models loaded</td></tr>';

  const ollamaTags = (ollama.tags || []).slice(0, 25).map(m => `
    <tr><td><code>${esc(m.name || '')}</code></td><td>${esc(m.parameter_size || '')}</td><td class="num">${num(m.size_mb || 0)} MB</td></tr>
  `).join('') || '<tr><td colspan="3" class="empty" style="padding:8px">No models</td></tr>';

  const lmsLoaded = (lmstudio.loaded || []).map(m => `
    <tr><td><code>${esc(m.id || '')}</code></td>
        <td>${esc(m.type || '')}</td>
        <td>${esc(m.arch || '')}</td>
        <td>${esc(m.quant || '')}</td>
        <td class="num">${m.loaded_context_length ? num(m.loaded_context_length) : ''}${m.max_context_length ? ' / ' + num(m.max_context_length) : ''}</td></tr>
  `).join('') || '<tr><td colspan="5" class="empty" style="padding:8px">No models loaded</td></tr>';

  const lmsAvailable = (lmstudio.available || []).slice(0, 25).map(m => `
    <tr><td><code>${esc(m.id || '')}</code></td><td>${esc(m.type || '')}</td><td>${esc(m.state || '')}</td></tr>
  `).join('') || '<tr><td colspan="3" class="empty" style="padding:8px">No models</td></tr>';

  $('system').innerHTML = `
    <div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">
      ${cpuCard}
      ${memCard}
      ${gpuCards}
    </div>

    <div class="stats-section">
      <h2><span class="reach-dot ${ollama.reachable ? 'ok' : 'bad'}"></span>Ollama Loaded Models <span style="color:#888;font-weight:normal;font-size:11px">${esc(now.ts ? new Date(now.ts*1000).toLocaleTimeString() : '')}</span></h2>
      <table style="width:100%">
        <thead><tr><th>Name</th><th>Params</th><th class="num">Size</th><th class="num">VRAM</th><th>Expires</th></tr></thead>
        <tbody>${ollamaPs}</tbody>
      </table>
    </div>

    <div class="stats-section">
      <h2><span class="reach-dot ${lmstudio.reachable ? 'ok' : 'bad'}"></span>LM Studio Loaded Models</h2>
      <table style="width:100%">
        <thead><tr><th>ID</th><th>Type</th><th>Arch</th><th>Quant</th><th class="num">Context</th></tr></thead>
        <tbody>${lmsLoaded}</tbody>
      </table>
    </div>

    <div class="stats-section">
      <h2>Ollama Available (top 25)</h2>
      <table style="width:100%">
        <thead><tr><th>Name</th><th>Params</th><th class="num">Size</th></tr></thead>
        <tbody>${ollamaTags}</tbody>
      </table>
    </div>

    <div class="stats-section">
      <h2>LM Studio Available (top 25)</h2>
      <table style="width:100%">
        <thead><tr><th>ID</th><th>Type</th><th>State</th></tr></thead>
        <tbody>${lmsAvailable}</tbody>
      </table>
    </div>
  `;
}

async function refreshAuditBadge() {
  try {
    const a = await (await fetch('/__proxy/api/audit?include_allow=false&limit=1')).json();
    const blocks = (a.counts && a.counts.block) || 0;
    const warns = (a.counts && a.counts.warn) || 0;
    const total = blocks + warns;
    const b = $('audit-badge');
    if (total > 0) { b.textContent = total; b.style.display = 'inline'; }
    else { b.style.display = 'none'; }
  } catch {}
}

function fmtSpan(s) {
  if (s < 60) return `${Math.round(s)}s`;
  if (s < 3600) return `${(s/60).toFixed(1)}m`;
  if (s < 86400) return `${(s/3600).toFixed(1)}h`;
  return `${(s/86400).toFixed(1)}d`;
}

setInterval(() => {
  if (!$('autoref').checked) return;
  if (view === 'stats') loadStats();
  else if (view === 'audit') loadAudit();
  else if (view === 'convs') { /* don't auto-reload conversation detail; respect current view */ }
  else if (view === 'system') loadSystem();
  else refresh();
  refreshAuditBadge();
}, 1500);
loadInfo();
refresh();
refreshAuditBadge();
</script>
