  .gate-block { background: #2a1818; border: 1px solid #6a3030; padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; }

</style>
</head>
<body>
<header>
  <h1>AI Proxy</h1>
  <span class="meta">→ <code id="upstream">…</code></span>
  <div class="tabs">
    <button class="tab active" id="tab-req" onclick="setView('requests')">Requests</button>
    <button class="tab" id="tab-convs" onclick="setView('convs')">Conversations</button>
    <button class="tab" id="tab-system" onclick="setView('system')">System</button>
    <button class="tab" id="tab-setup" onclick="setView('setup')">Setup</button>
    <button class="tab" id="tab-stats" onclick="setView('stats')">Stats</button>
    <button class="tab" id="tab-audit" onclick="setView('audit')">Audit <span id="audit-badge" style="display:none;background:#bf616a;color:#fff;border-radius:8px;padding:0 5px;margin-left:4px;font-size:10px"></span></button>
  </div>
  <span style="flex:1"></span>
  <span class="meta" id="count"></span>
  <label><input type="checkbox" id="autoref" checked> auto-refresh</label>
  <button onclick="refresh()">Refresh</button>
  <button onclick="clearAll()">Clear</button>
</header>
<div id="main">
  <div id="list">
    <table>
      <thead><tr><th>Time</th><th>Client</th><th>Method</th><th>Path</th><th>Model</th><th>Status</th><th class="num">tokens</th><th class="ms">ms</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">No requests captured yet.</div>
  </div>
  <div id="detail"><div class="empty">Select a request to inspect</div></div>
  <div id="stats"></div>
  <div id="audit"></div>
  <div id="convs"></div>
  <div id="system"></div>
  <div id="setup"></div>
</div>
<script>
let selected = null;
let items = [];
let view = 'requests';
let lastDetailSig = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => (s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
const num = (n) => (n == null ? '' : Number(n).toLocaleString());

function setView(v) {
  view = v;
  for (const t of ['req','stats','audit','convs','system','setup']) {
    const b = $('tab-' + t);
    if (b) b.classList.toggle('active', v === (t === 'req' ? 'requests' : t));
  }
  for (const c of ['stats','audit','convs','system','setup']) {
    $('main').classList.toggle(c, v === c);
    $(c).classList.toggle('show', v === c);
  }
  if (v === 'stats') loadStats();
  else if (v === 'audit') loadAudit();
  else if (v === 'convs') loadConversations();
  else if (v === 'system') loadSystem();
  else if (v === 'setup') loadSetup();
  else refresh();
}

async function loadInfo() {
  try {
    const d = await (await fetch('/__proxy/api/info')).json();
    const parts = [d.upstream];
    if (d.anthropic) parts.push(d.anthropic + ' (anthropic)');
    $('upstream').textContent = parts.join('  ·  ');
  } catch {}
}

async function refresh() {
  try {
    const d = await (await fetch('/__proxy/api/requests')).json();
    items = d.items;
    $('count').textContent = `${d.total} request${d.total === 1 ? '' : 's'}`;
    renderList();
    if (selected) {
      const still = items.find(i => i.id === selected);
      if (still) await loadDetail(selected);
    }
  } catch (e) { /* ignore transient errors */ }
}

function fmt(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString([], { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
}

function renderList() {
  $('empty').style.display = items.length ? 'none' : 'block';
  $('rows').innerHTML = items.map(it => {
    let status;
    if (it.error && !it.status) status = '<span class="status-0">ERR</span>';
    else if (!it.status) status = '<span class="dot live"></span>pending';
    else status = `<span class="status-${String(it.status)[0]}">${it.status}</span>`;
    const stream = it.is_stream ? '<span class="badge">SSE</span>' : '';
    const ms = it.duration_ms ? Math.round(it.duration_ms) : '';
    let tokens = it.total_tokens ? num(it.total_tokens) : (it.completion_tokens ? num(it.completion_tokens) : '');
    if (tokens && it.tokens_live) {
      const tip = it.tokens_estimated ? 'estimated prompt tokens (chars/3.5); upstream usage not yet received' : 'live token count from upstream stream — still in flight';
      tokens = `<span style="color:#ebcb8b;font-style:italic" title="${tip}">${tokens}${it.tokens_estimated ? '~' : ''}<span style="color:#888"> live</span></span>`;
    }
    const sel = it.id === selected ? 'selected' : '';
    const appBadge = it.client_app
      ? `<div style="margin-top:2px"><span class="app-badge app-${esc(it.client_app)}" title="Detected client SDK / app">${esc(it.client_app)}</span></div>`
      : '';
    const ipCell = `<code style="font-size:11px">${esc(it.client_ip || '')}</code>${appBadge}`;
    let rowCls = sel;
    let pathExtra = '';
    if (it.gate_verdict === 'block') { rowCls += ' row-block'; pathExtra = ` <span class="verdict block" title="${esc(it.gate_reason || '')}">${esc(it.gate_rule || 'BLOCK')}</span>`; }
    else if (it.gate_verdict === 'warn') { rowCls += ' row-warn'; pathExtra = ` <span class="verdict warn" title="${esc(it.gate_reason || '')}">${esc(it.gate_rule || 'WARN')}</span>`; }
    else if (it.gate_verdict === 'rewrite') {
      rowCls += ' row-rewrite';
      let badge = 'rewrite';
      const rule = it.gate_rule || '';
      if (rule === 'model_router') badge = 'routed';
      else if (rule === 'ollama_options') badge = 'options';
      else if (rule === 'tool_args_autofix') badge = 'autofixed';
      else if (rule.includes('+')) badge = rule.replace('model_router', 'routed').replace('ollama_options', 'options');
      else if (rule) badge = rule;
      pathExtra = ` <span class="verdict rewrite" title="${esc(it.gate_reason || '')}">${esc(badge)}</span>`;
    }
    else if (it.gate_verdict === 'intercept') { rowCls += ' row-intercept'; pathExtra = ` <span class="verdict intercept" title="${esc(it.gate_reason || '')}">${esc(it.gate_rule || 'intercepted')}</span>`; }
    return `<tr class="${rowCls}" data-id="${it.id}"><td>${fmt(it.ts)}</td><td>${ipCell}</td><td class="method">${esc(it.method)}</td><td class="path" title="${esc(it.path)}">${esc(it.path)}${stream}${pathExtra}</td><td>${esc(it.model || '')}</td><td>${status}</td><td class="num">${tokens}</td><td class="ms">${ms}</td></tr>`;
  }).join('');
  for (const tr of $('rows').querySelectorAll('tr')) {
    tr.onclick = () => selectItem(tr.dataset.id);
  }
}

async function selectItem(id) {
  // Navigating to a different request implicitly closes any open compare view.
  if (compareView && compareView.primaryId !== id) compareView = null;
  selected = id;
  lastDetailSig = null;  // force re-render for newly opened item
  renderList();
  await loadDetail(id);
}

function tryPretty(s) {
  if (!s) return '';
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; }
}

function renderSSE(s) {
  if (!s) return '';
  const out = [];
  for (const line of s.split('\n')) {
    if (line.startsWith('data: ')) {
      const data = line.slice(6);
      if (data === '[DONE]' || data.trim() === '') { out.push(line); continue; }
      try { out.push('data: ' + JSON.stringify(JSON.parse(data), null, 2)); } catch { out.push(line); }
    } else {
      out.push(line);
    }
  }
  return out.join('\n');
}

// Reconstruct assistant text from SSE stream chunks (OpenAI chat.completion.chunk format)
// Parse a request body and return a structured summary for the analysis panel.
function analyzeRequest(bodyText) {
  if (!bodyText) return null;
  let j; try { j = JSON.parse(bodyText); } catch { return null; }
  if (!j || typeof j !== 'object') return null;

  const params = {};
  for (const k of ['temperature','top_p','top_k','max_tokens','max_completion_tokens','seed','presence_penalty','frequency_penalty','stream','response_format','tool_choice','reasoning_effort']) {
    if (j[k] !== undefined) params[k] = j[k];
  }
  if (j.options && typeof j.options === 'object') params.options = j.options;

  const roles = {};
  const messages = j.messages || [];
  // Build tool_call_id → {name, args} from assistant turns. Handles both OpenAI
  // (assistant.tool_calls[]) and Anthropic (assistant.content[].type=='tool_use').
  const tcMap = {};
  for (const m of messages) {
    if (!m || m.role !== 'assistant') continue;
    if (Array.isArray(m.tool_calls)) {
      for (const tc of m.tool_calls) {
        if (tc && tc.id && tc.function) {
          tcMap[tc.id] = { name: tc.function.name, args: tc.function.arguments };
        }
      }
    }
    if (Array.isArray(m.content)) {
      for (const blk of m.content) {
        if (blk && blk.type === 'tool_use' && blk.id && blk.name) {
          tcMap[blk.id] = { name: blk.name, args: blk.input == null ? '' : JSON.stringify(blk.input) };
        }
      }
    }
  }
  // Flatten Anthropic content blocks into a plain text representation for "chars" counts.
  const flattenContent = (c) => {
    if (typeof c === 'string') return c;
    if (c == null) return '';
    if (Array.isArray(c)) {
      const parts = [];
      for (const p of c) {
        if (!p || typeof p !== 'object') continue;
        if (typeof p.text === 'string') parts.push(p.text);
        else if (p.type === 'tool_use' && p.input != null) parts.push(JSON.stringify(p.input));
        else if (p.type === 'tool_result') {
          const inner = p.content;
          if (typeof inner === 'string') parts.push(inner);
          else if (Array.isArray(inner)) for (const ip of inner) if (ip && typeof ip.text === 'string') parts.push(ip.text);
        }
      }
      return parts.join('\n');
    }
    return JSON.stringify(c);
  };
  let lastUser = null, lastSystem = null, toolResults = [];
  for (const m of messages) {
    const role = m.role || 'unknown';
    const content = flattenContent(m.content);
    roles[role] = roles[role] || { count: 0, chars: 0 };
    roles[role].count += 1;
    roles[role].chars += content.length;
    if (role === 'user') lastUser = content;
    if (role === 'system') lastSystem = content;
    // OpenAI tool-result message
    if (role === 'tool') {
      const call = m.tool_call_id ? tcMap[m.tool_call_id] : null;
      toolResults.push({
        name: (call && call.name) || m.name || '?',
        content,
        tool_call_id: m.tool_call_id,
        calledWith: call,
      });
    }
    // Anthropic tool_result blocks live inside user messages
    if (role === 'user' && Array.isArray(m.content)) {
      for (const blk of m.content) {
        if (!blk || blk.type !== 'tool_result') continue;
        const call = blk.tool_use_id ? tcMap[blk.tool_use_id] : null;
        let inner = blk.content;
        if (Array.isArray(inner)) inner = inner.map(p => (p && typeof p.text === 'string') ? p.text : '').join('\n');
        else if (inner == null) inner = '';
        else if (typeof inner !== 'string') inner = JSON.stringify(inner);
        if (blk.is_error && inner && !/^error/i.test(inner)) inner = 'Error: ' + inner;
        toolResults.push({
          name: (call && call.name) || '?',
          content: inner,
          tool_call_id: blk.tool_use_id,
          calledWith: call,
        });
      }
    }
    if (role === 'assistant') {
      let tcCount = 0;
      if (Array.isArray(m.tool_calls)) tcCount += m.tool_calls.length;
      if (Array.isArray(m.content)) tcCount += m.content.filter(b => b && b.type === 'tool_use').length;
      if (tcCount) roles.assistant.tool_calls = (roles.assistant.tool_calls || 0) + tcCount;
    }
  }

  // Anthropic system: top-level field (string or list of {type:'text',text}).
  if (!lastSystem && j.system != null) {
    if (typeof j.system === 'string') lastSystem = j.system;
    else if (Array.isArray(j.system)) lastSystem = j.system.map(p => (p && typeof p.text === 'string') ? p.text : '').join('\n');
    if (lastSystem) {
      roles.system = roles.system || { count: 0, chars: 0 };
      roles.system.count += 1;
      roles.system.chars += lastSystem.length;
    }
  }

  // Ollama /api/generate uses a flat "prompt" string.
  if (!messages.length && typeof j.prompt === 'string') {
    roles.prompt = { count: 1, chars: j.prompt.length };
    lastUser = j.prompt;
  }

  const tools = (j.tools || []).map(t => {
    // OpenAI: tools[i].function.{name,description,parameters}; Anthropic: tools[i].{name,description,input_schema}
    const fn = (t.function && typeof t.function === 'object') ? t.function : t;
    return { name: fn.name || '?', description: fn.description || '', params: fn.parameters || fn.input_schema || null };
  });

  return { params, roles, messages: messages.length, lastUser, lastSystem, toolResults, tools };
}

// Walk a response body or SSE stream and extract finish reason + invoked tool calls + assistant content length.
// Handles three response shapes: OpenAI chat.completion(.chunk), Ollama native /api/chat, and Anthropic /v1/messages.
function analyzeResponse(respBody, streamChunks) {
  const out = { finish_reason: null, tool_calls: [], content_chars: 0, content: '' };

  function fromObj(j) {
    if (!j || typeof j !== 'object') return;
    const choices = j.choices || [];
    for (const c of choices) {
      if (c.finish_reason) out.finish_reason = c.finish_reason;
      const msg = c.message || c.delta || {};
      if (typeof msg.content === 'string') out.content += msg.content;
      for (const tc of (msg.tool_calls || [])) {
        const fn = tc.function || {};
        out.tool_calls.push({ name: fn.name || '?', arguments: fn.arguments || '' });
      }
    }
    // Ollama native shape
    if (j.message && typeof j.message === 'object') {
      if (typeof j.message.content === 'string') out.content += j.message.content;
      for (const tc of (j.message.tool_calls || [])) {
        const fn = tc.function || {};
        out.tool_calls.push({ name: fn.name || '?', arguments: fn.arguments ? JSON.stringify(fn.arguments) : '' });
      }
    }
    if (j.done_reason) out.finish_reason = out.finish_reason || j.done_reason;
    // Anthropic non-streaming /v1/messages: {type:"message", role:"assistant", content:[...], stop_reason}
    if (j.type === 'message' && Array.isArray(j.content)) {
      if (j.stop_reason) out.finish_reason = out.finish_reason || j.stop_reason;
      for (const blk of j.content) {
        if (!blk || typeof blk !== 'object') continue;
        if (blk.type === 'text' && typeof blk.text === 'string') out.content += blk.text;
        else if (blk.type === 'tool_use') {
          out.tool_calls.push({
            name: blk.name || '?',
            arguments: blk.input == null ? '' : JSON.stringify(blk.input),
          });
        }
      }
    }
  }

  if (respBody) { try { fromObj(JSON.parse(respBody)); } catch {} }

  if (streamChunks) {
    // Streaming tool calls: name appears once per index, arguments accumulate as a string.
    const tcByIdx = {};                  // OpenAI/Ollama
    const anthroBlocks = {};             // Anthropic: index -> {type, name, input_json}
    for (const line of streamChunks.split('\n')) {
      let data = null;
      if (line.startsWith('data: ')) data = line.slice(6);
      else if (line.trim().startsWith('{')) data = line.trim();
      if (!data || data === '[DONE]') continue;
      let j; try { j = JSON.parse(data); } catch { continue; }
      // OpenAI chat.completion.chunk
      for (const c of j.choices || []) {
        if (c.finish_reason) out.finish_reason = c.finish_reason;
        const delta = c.delta || c.message || {};
        if (typeof delta.content === 'string') out.content += delta.content;
        for (const tc of (delta.tool_calls || [])) {
          const idx = tc.index ?? Object.keys(tcByIdx).length;
          const slot = tcByIdx[idx] = tcByIdx[idx] || { name: '', arguments: '' };
          const fn = tc.function || {};
          if (fn.name) slot.name = fn.name;
          if (fn.arguments) slot.arguments += fn.arguments;
        }
      }
      if (j.done_reason) out.finish_reason = out.finish_reason || j.done_reason;
      if (j.message && j.message.tool_calls) {
        for (const tc of j.message.tool_calls) {
          const fn = tc.function || {};
          out.tool_calls.push({ name: fn.name || '?', arguments: fn.arguments ? JSON.stringify(fn.arguments) : '' });
        }
      }
      // Anthropic SSE event payloads carry `type` at top level.
      if (typeof j.type === 'string') {
        if (j.type === 'content_block_start' && j.content_block && typeof j.index === 'number') {
          if (j.content_block.type === 'tool_use') {
            anthroBlocks[j.index] = {
              type: 'tool_use',
              name: j.content_block.name || '?',
              input_json: '',
            };
          } else if (j.content_block.type === 'text') {
            anthroBlocks[j.index] = { type: 'text' };
            if (typeof j.content_block.text === 'string') out.content += j.content_block.text;
          }
        } else if (j.type === 'content_block_delta' && j.delta && typeof j.index === 'number') {
          if (j.delta.type === 'text_delta' && typeof j.delta.text === 'string') {
            out.content += j.delta.text;
          } else if (j.delta.type === 'input_json_delta' && typeof j.delta.partial_json === 'string') {
            const slot = anthroBlocks[j.index];
            if (slot && slot.type === 'tool_use') slot.input_json += j.delta.partial_json;
          }
        } else if (j.type === 'message_delta' && j.delta && j.delta.stop_reason) {
          out.finish_reason = out.finish_reason || j.delta.stop_reason;
        } else if (j.type === 'message_start' && j.message && j.message.stop_reason) {
          out.finish_reason = out.finish_reason || j.message.stop_reason;
        }
      }
    }
    for (const k of Object.keys(tcByIdx)) out.tool_calls.push(tcByIdx[k]);
    for (const k of Object.keys(anthroBlocks)) {
      const b = anthroBlocks[k];
      if (b && b.type === 'tool_use') out.tool_calls.push({ name: b.name, arguments: b.input_json });
    }
  }

  out.content_chars = out.content.length;
  return out;
}

function renderAnalysis(d) {
  const req = analyzeRequest(d.request_body);
  const resp = analyzeResponse(d.response_body, d.stream_chunks);
  if (!req && (!resp.tool_calls.length && !resp.finish_reason && !resp.content_chars)) return '';

  let reqHtml = '';
  if (req) {
    const paramsRows = Object.entries(req.params).map(([k, v]) =>
      `<tr><td><code>${esc(k)}</code></td><td><code>${esc(typeof v === 'object' ? JSON.stringify(v) : String(v))}</code></td></tr>`
    ).join('') || '<tr><td colspan="2" style="color:#666">(none)</td></tr>';

    const roleRows = Object.entries(req.roles).map(([role, info]) => {
      const extra = info.tool_calls ? ` · ${info.tool_calls} tool_call${info.tool_calls === 1 ? '' : 's'}` : '';
      return `<tr><td>${esc(role)}</td><td class="num">${num(info.count)}</td><td class="num">${num(info.chars)}${extra}</td></tr>`;
    }).join('');

    const userPreview = req.lastUser ? `<div class="section"><h3>Latest User Message (${num(req.lastUser.length)} chars)</h3><pre data-k="lastuser" style="max-height:240px">${esc(req.lastUser.slice(0, 4000))}${req.lastUser.length > 4000 ? '\n…' : ''}</pre></div>` : '';
    const sysPreview = req.lastSystem ? `<div class="section"><h3>System Message (${num(req.lastSystem.length)} chars)</h3><pre data-k="sys" style="max-height:280px">${esc(req.lastSystem)}</pre></div>` : '';

    const toolList = req.tools.length ? `
      <div class="section"><h3>Tools Defined (${req.tools.length})</h3>
        <table style="width:100%"><thead><tr><th>Name</th><th>Description</th></tr></thead>
        <tbody>${req.tools.map(t => `<tr><td><code>${esc(t.name)}</code></td><td style="color:#aaa">${esc((t.description || '').slice(0, 200))}</td></tr>`).join('')}</tbody></table>
      </div>` : '';

    const toolResultsHtml = req.toolResults.length ? `
      <div class="section"><h3>Tool Results In Request (${req.toolResults.length})</h3>
        ${req.toolResults.map(t => {
          const er = looksLikeToolError(t.content);
          const cls = er.isError ? 'tool-error-msg' : '';
          const summaryCls = er.isError ? 'tool-error-summary' : '';
          const excerpt = er.isError ? `<span class="tool-error-excerpt">${esc(er.excerpt || '')}</span>` : '';
          let argsHtml = '';
          if (t.calledWith && t.calledWith.args) {
            let argsPretty = t.calledWith.args;
            try { argsPretty = JSON.stringify(JSON.parse(t.calledWith.args), null, 2); } catch {}
            argsHtml = `<div style="margin:6px 0 4px 0;font-size:11px;color:#88c0d0">→ called with</div><pre style="max-height:160px;font-size:11px">${esc(argsPretty)}</pre><div style="margin:6px 0 4px 0;font-size:11px;color:#888">→ returned</div>`;
          }
          return `<details class="${cls}" style="margin-bottom:6px"><summary class="${summaryCls}"><code>${esc(t.name)}</code> · ${num(t.content.length)} chars${excerpt}</summary>${argsHtml}<pre data-k="tr-${esc(t.name)}" style="max-height:200px">${esc(t.content.slice(0, 4000))}</pre></details>`;
        }).join('')}
      </div>` : '';

    reqHtml = `
      <div class="section"><h3>Sampling Params</h3>
        <table style="width:auto;min-width:280px"><tbody>${paramsRows}</tbody></table>
      </div>
      <div class="section"><h3>Messages (${num(req.messages)})</h3>
        <table style="width:auto;min-width:340px"><thead><tr><th>Role</th><th class="num">Count</th><th class="num">Chars</th></tr></thead><tbody>${roleRows}</tbody></table>
      </div>
      ${sysPreview}${userPreview}${toolList}${toolResultsHtml}
    `;
  }

  let respHtml = '';
  if (resp.finish_reason || resp.tool_calls.length || resp.content_chars) {
    const tcRows = resp.tool_calls.map(t => {
      let argPretty = t.arguments;
      try { argPretty = JSON.stringify(JSON.parse(t.arguments), null, 2); } catch {}
      return `<details style="margin-bottom:6px"><summary><code>${esc(t.name)}</code> · ${num((t.arguments || '').length)} char args</summary><pre data-k="tc-${esc(t.name)}" style="max-height:240px">${esc(argPretty)}</pre></details>`;
    }).join('') || '<div style="color:#666">(none)</div>';
    respHtml = `
      <div class="section"><h3>Response Analysis</h3>
        <div>finish_reason: <code>${esc(resp.finish_reason || '—')}</code> · assistant content: ${num(resp.content_chars)} chars · ${resp.tool_calls.length} tool call${resp.tool_calls.length === 1 ? '' : 's'}</div>
      </div>
      ${resp.tool_calls.length ? `<div class="section"><h3>Tool Calls Invoked</h3>${tcRows}</div>` : ''}
    `;
  }

  return reqHtml + respHtml;
}

// Heuristic: does this tool-result content look like an error? Returns { isError, excerpt }.
function looksLikeToolError(text) {
  if (!text) return { isError: false, excerpt: null };
  const s = String(text).trim();
  if (!s) return { isError: false, excerpt: null };
  try {
    const j = JSON.parse(s);
    if (j && typeof j === 'object' && !Array.isArray(j)) {
      if (j.error || j.success === false || j.isError) {
        let msg = (typeof j.error === 'string') ? j.error : (j.message || (typeof j.error === 'object' ? JSON.stringify(j.error) : null));
        if (!msg) msg = JSON.stringify(j).slice(0, 240);
        return { isError: true, excerpt: String(msg).slice(0, 240) };
      }
    }
  } catch {}
  const firstLine = s.split('\n', 1)[0];
  const fl = firstLine.toLowerCase();
  if (fl.startsWith('error') || fl.startsWith('exception')) return { isError: true, excerpt: firstLine.slice(0, 240) };
  const patterns = ['must have required property', 'validation error', 'is not allowed', 'is required', 'is invalid', 'could not be', 'failed to', 'traceback (most recent call'];
  const sLower = s.toLowerCase();
  for (const p of patterns) {
    if (sLower.includes(p)) return { isError: true, excerpt: firstLine.slice(0, 240) };
  }
  return { isError: false, excerpt: null };
}

function reconstructStream(s) {
  if (!s) return '';
  const parts = [];
  for (const line of s.split('\n')) {
    if (!line.startsWith('data: ')) continue;
    const data = line.slice(6);
    if (data === '[DONE]') continue;
    try {
      const j = JSON.parse(data);
      // OpenAI chat.completion.chunk
      const c = j.choices && j.choices[0];
      if (c) {
        const delta = c.delta || c.message || {};
        if (delta.content) parts.push(delta.content);
      }
      // Anthropic SSE: text arrives via content_block_delta {delta:{type:'text_delta',text}}
      // and (occasionally) content_block_start carries pre-set text.
      if (j.type === 'content_block_delta' && j.delta && j.delta.type === 'text_delta' && typeof j.delta.text === 'string') {
        parts.push(j.delta.text);
      } else if (j.type === 'content_block_start' && j.content_block && j.content_block.type === 'text' && typeof j.content_block.text === 'string') {
        parts.push(j.content_block.text);
      }
    } catch {}
  }
  return parts.join('');
}

// Map provider-specific finish reasons to a canonical token so cross-shape comparisons
// don't false-flag (e.g. Anthropic 'tool_use' is the same outcome as OpenAI 'tool_calls').
function _normFinish(r) {
  if (!r) return null;
  const s = String(r).toLowerCase();
  if (s === 'tool_use' || s === 'tool_calls' || s === 'function_call') return 'tool_use';
  if (s === 'end_turn' || s === 'stop') return 'end_turn';
  if (s === 'max_tokens' || s === 'length') return 'max_tokens';
  if (s === 'stop_sequence' || s === 'content_filter') return 'stop_sequence';
  return s;
}

// 4-gram Jaccard similarity between two strings (0-1). Cheap, character-level, language-agnostic.
function _ngrams(text, n = 4) {
  const s = (text || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const out = new Set();
  for (let i = 0; i + n <= s.length; i++) out.add(s.slice(i, i + n));
  return out;
}
function _jaccard(a, b) {
  if (!a.size && !b.size) return 1.0;
  let inter = 0;
  for (const x of a) if (b.has(x)) inter++;
  const union = a.size + b.size - inter;
  return union ? inter / union : 0;
}

// Normalize a tool_call's args for argument-equality comparison (key order, whitespace).
function _normArgs(args) {
  if (args == null || args === '') return '';
  try {
    const parsed = typeof args === 'string' ? JSON.parse(args) : args;
    return JSON.stringify(parsed, Object.keys(parsed || {}).sort());
  } catch {
    return String(args);
  }
}

// Compare a primary request and one of its shadows. Returns a structured comparison or null
// when the shadow doesn't have a response yet.
function compareShadow(primary, shadow, primaryAnalysis) {
  if (!shadow || (!shadow.response_body && !shadow.stream_chunks)) return null;
  const pAnalysis = primaryAnalysis || analyzeResponse(primary.response_body, primary.stream_chunks);
  const sAnalysis = analyzeResponse(shadow.response_body, shadow.stream_chunks);

  const cmp = {};

  if (primary.duration_ms != null && shadow.duration_ms != null) {
    cmp.latency = {
      primary: Math.round(primary.duration_ms),
      shadow: Math.round(shadow.duration_ms),
      ratio: primary.duration_ms ? shadow.duration_ms / primary.duration_ms : null,
    };
  }
  if (primary.total_tokens != null || shadow.total_tokens != null) {
    cmp.tokens = {
      primary_in: primary.prompt_tokens || 0,
      shadow_in: shadow.prompt_tokens || 0,
      primary_out: primary.completion_tokens || 0,
      shadow_out: shadow.completion_tokens || 0,
    };
  }
  cmp.content = {
    primary: pAnalysis.content_chars || 0,
    shadow: sAnalysis.content_chars || 0,
  };
  cmp.finish = {
    primary: pAnalysis.finish_reason || '?',
    shadow: sAnalysis.finish_reason || '?',
    matches: _normFinish(pAnalysis.finish_reason) === _normFinish(sAnalysis.finish_reason),
  };

  // Tool calls: name set comparison + per-name arg equality.
  const pTools = (pAnalysis.tool_calls || []).map(t => ({ name: t.name || '?', args: _normArgs(t.arguments) }));
  const sTools = (sAnalysis.tool_calls || []).map(t => ({ name: t.name || '?', args: _normArgs(t.arguments) }));
  const pNames = pTools.map(t => t.name);
  const sNames = sTools.map(t => t.name);
  const pSet = new Set(pNames);
  const sSet = new Set(sNames);
  const onlyP = [...new Set(pNames)].filter(n => !sSet.has(n));
  const onlyS = [...new Set(sNames)].filter(n => !pSet.has(n));
  const shared = [...pSet].filter(n => sSet.has(n));
  const argsMatch = {};
  for (const n of shared) {
    const pa = pTools.find(t => t.name === n);
    const sa = sTools.find(t => t.name === n);
    argsMatch[n] = pa && sa && pa.args === sa.args;
  }
  const overlapDenom = pSet.size + sSet.size - shared.length;
  cmp.tools = {
    primary_count: pNames.length,
    shadow_count: sNames.length,
    shared,
    only_primary: onlyP,
    only_shadow: onlyS,
    args_match: argsMatch,
    name_overlap: overlapDenom ? shared.length / overlapDenom : 1.0,
  };

  const pText = (pAnalysis.content || '').slice(0, 20000);
  const sText = (sAnalysis.content || '').slice(0, 20000);
  if (!pText && !sText) cmp.text_similarity = null;
  else if (!pText || !sText) cmp.text_similarity = 0;
  else cmp.text_similarity = _jaccard(_ngrams(pText), _ngrams(sText));

  return cmp;
}

function _renderShadowComparison(cmp) {
  if (!cmp) return '';
  const rows = [];
  if (cmp.latency) {
    const r = cmp.latency.ratio;
    let note = '';
    let cls = '';
    if (r != null) {
      if (r < 0.5) { note = ` · <span style="color:#a3be8c">${(1/r).toFixed(1)}× faster</span>`; cls = 'cmp-good'; }
      else if (r < 1.2) { note = ' · ≈ same speed'; cls = 'cmp-good'; }
      else if (r < 3) { note = ` · <span style="color:#ebcb8b">${r.toFixed(1)}× slower</span>`; cls = 'cmp-warn'; }
      else { note = ` · <span style="color:#e08080">${r.toFixed(1)}× slower</span>`; cls = 'cmp-bad'; }
    }
    rows.push(`<div class="cmp-row ${cls}"><span class="cmp-label">⏱ Latency</span> primary <strong>${num(cmp.latency.primary)}ms</strong> · shadow <strong>${num(cmp.latency.shadow)}ms</strong>${note}</div>`);
  }
  if (cmp.tokens) {
    const inDelta = cmp.tokens.shadow_in - cmp.tokens.primary_in;
    const outDelta = cmp.tokens.shadow_out - cmp.tokens.primary_out;
    const inSign = inDelta >= 0 ? '+' : '';
    const outSign = outDelta >= 0 ? '+' : '';
    rows.push(`<div class="cmp-row"><span class="cmp-label">📊 Tokens</span> in: <strong>${num(cmp.tokens.primary_in)}</strong> → <strong>${num(cmp.tokens.shadow_in)}</strong> (${inSign}${num(inDelta)}) · out: <strong>${num(cmp.tokens.primary_out)}</strong> → <strong>${num(cmp.tokens.shadow_out)}</strong> (${outSign}${num(outDelta)})</div>`);
  }
  if (cmp.content && (cmp.content.primary || cmp.content.shadow)) {
    const delta = cmp.content.shadow - cmp.content.primary;
    const sign = delta >= 0 ? '+' : '';
    const ratio = cmp.content.primary ? (cmp.content.shadow / cmp.content.primary).toFixed(2) + '×' : '—';
    rows.push(`<div class="cmp-row"><span class="cmp-label">💬 Reply chars</span> primary <strong>${num(cmp.content.primary)}</strong> · shadow <strong>${num(cmp.content.shadow)}</strong> (${sign}${num(delta)}, ${ratio})</div>`);
  }
  if (cmp.tools && (cmp.tools.primary_count || cmp.tools.shadow_count)) {
    const t = cmp.tools;
    const sameSet = t.only_primary.length === 0 && t.only_shadow.length === 0 && t.shared.length === t.primary_count;
    const argsAllMatch = sameSet && Object.values(t.args_match).every(Boolean);
    if (sameSet && argsAllMatch && t.shared.length) {
      rows.push(`<div class="cmp-row cmp-good"><span class="cmp-label">🔧 Tools</span> both called <strong>${esc(t.shared.join(', '))}</strong> · args match</div>`);
    } else if (sameSet) {
      const diff = Object.entries(t.args_match).filter(([, v]) => !v).map(([n]) => n);
      rows.push(`<div class="cmp-row cmp-warn"><span class="cmp-label">🔧 Tools</span> same set <strong>${esc(t.shared.join(', '))}</strong> · args differ on <strong>${esc(diff.join(', '))}</strong></div>`);
    } else {
      const onlyP = t.only_primary.length ? `primary-only: <strong>${esc(t.only_primary.join(', '))}</strong>` : '';
      const onlyS = t.only_shadow.length ? `shadow-only: <strong>${esc(t.only_shadow.join(', '))}</strong>` : '';
      const shared = t.shared.length ? `shared: <strong>${esc(t.shared.join(', '))}</strong>` : '';
      const cls = t.name_overlap >= 0.5 ? 'cmp-warn' : 'cmp-bad';
      rows.push(`<div class="cmp-row ${cls}"><span class="cmp-label">🔧 Tools</span> ${[shared, onlyP, onlyS].filter(Boolean).join(' · ')} · overlap ${(t.name_overlap*100).toFixed(0)}%</div>`);
    }
  }
  if (cmp.finish) {
    const cls = cmp.finish.matches ? 'cmp-good' : 'cmp-warn';
    rows.push(`<div class="cmp-row ${cls}"><span class="cmp-label">🏁 Finish</span> primary <code>${esc(cmp.finish.primary)}</code> · shadow <code>${esc(cmp.finish.shadow)}</code>${cmp.finish.matches ? ' · match' : ''}</div>`);
  }
  if (cmp.text_similarity != null) {
    const pct = (cmp.text_similarity * 100).toFixed(0);
    let cls = 'cmp-good', label = 'near match';
    if (cmp.text_similarity < 0.4) { cls = 'cmp-bad'; label = 'very different'; }
    else if (cmp.text_similarity < 0.7) { cls = 'cmp-warn'; label = 'diverges'; }
    rows.push(`<div class="cmp-row ${cls}"><span class="cmp-label">🔁 Text overlap</span> ${pct}% (4-gram Jaccard) · ${label}</div>`);
  }
  return `<div class="shadow-cmp">${rows.join('')}</div>`;
}

// Extract a comparable assistant text from a stored response (handles both Anthropic
// non-streaming and OpenAI non-streaming shapes — shadows are always non-streaming).
function _shadowResponseText(s) {
  if (!s) return '';
  if (s.stream_chunks) return reconstructStream(s.stream_chunks);
  if (!s.response_body) return '';
  try {
    const j = JSON.parse(s.response_body);
    if (j && j.type === 'message' && Array.isArray(j.content)) {
      return j.content.filter(b => b && b.type === 'text').map(b => b.text || '').join('');
    }
    const ch = j && j.choices && j.choices[0];
    if (ch) {
      const m = ch.message || ch.delta || {};
      if (typeof m.content === 'string') return m.content;
    }
    if (j && j.message && typeof j.message.content === 'string') return j.message.content;
  } catch {}
  return s.response_body.slice(0, 4000);
}

// Tracks the open compare view ({primaryId, shadowId} | null). When set, loadDetail
// renders the comparison page instead of the normal detail layout.
let compareView = null;

async function openCompare(primaryId, shadowId) {
  compareView = { primaryId, shadowId };
  selected = primaryId;
  lastDetailSig = null;
  await loadDetail(primaryId);
}

function closeCompare() {
  const id = compareView ? compareView.primaryId : selected;
  compareView = null;
  lastDetailSig = null;
  loadDetail(id);
}

function _toolCardsHtml(analysis) {
  if (!analysis.tool_calls || !analysis.tool_calls.length) return '<div style="color:#666;font-size:11px">(no tool calls)</div>';
  return analysis.tool_calls.map(tc => {
    let pretty = tc.arguments || '';
    try { pretty = JSON.stringify(JSON.parse(tc.arguments || '{}'), null, 2); } catch {}
    return `<div class="tool-card">
      <div class="tool-name">🔧 ${esc(tc.name || '?')}</div>
      <pre>${esc(pretty)}</pre>
    </div>`;
  }).join('');
}

function _toolPairsHtml(primaryAnalysis, shadowAnalysis) {
  const pTools = primaryAnalysis.tool_calls || [];
  const sTools = shadowAnalysis.tool_calls || [];
  if (!pTools.length && !sTools.length) return '';
  // Pair by name; if a name appears multiple times on either side, pair in arrival order.
  const pByName = {};
  const sByName = {};
  for (const t of pTools) (pByName[t.name] ||= []).push(t);
  for (const t of sTools) (sByName[t.name] ||= []).push(t);
  const allNames = [...new Set([...Object.keys(pByName), ...Object.keys(sByName)])];
  const pairs = [];
  for (const n of allNames) {
    const ps = pByName[n] || [];
    const ss = sByName[n] || [];
    const max = Math.max(ps.length, ss.length);
    for (let i = 0; i < max; i++) pairs.push({ name: n, primary: ps[i] || null, shadow: ss[i] || null });
  }
  const rows = pairs.map(p => {
    let tag, tagCls;
    if (!p.primary) { tag = 'shadow only'; tagCls = 'tag-only'; }
    else if (!p.shadow) { tag = 'primary only'; tagCls = 'tag-only'; }
    else {
      const pa = _normArgs(p.primary.arguments);
      const sa = _normArgs(p.shadow.arguments);
      if (pa === sa) { tag = 'args match'; tagCls = 'tag-match'; }
      else { tag = 'args differ'; tagCls = 'tag-diff'; }
    }
    const fmt = (tc) => {
      if (!tc) return '<div class="empty">(not called)</div>';
      let pretty = tc.arguments || '';
      try { pretty = JSON.stringify(JSON.parse(tc.arguments || '{}'), null, 2); } catch {}
      return `<pre>${esc(pretty)}</pre>`;
    };
    return `<div class="compare-tool-pair">
      <div class="pair-name">🔧 ${esc(p.name)} <span class="pair-tag ${tagCls}">${tag}</span></div>
      <div class="pair-grid">
        <div>${fmt(p.primary)}</div>
        <div>${fmt(p.shadow)}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="compare-tools">
    <h3>🔧 Tool calls — paired</h3>
    <div style="font-size:11px;color:#888;margin-bottom:6px">left: primary &nbsp;·&nbsp; right: shadow</div>
    ${rows}
  </div>`;
}

function _renderCompareView(primary, shadow) {
  if (!shadow) {
    return `<div class="compare-view">
      <div class="compare-header">
        <button onclick="closeCompare()">← Back</button>
        <h2>Shadow not found</h2>
      </div>
      <div class="empty">The selected shadow is no longer attached to this primary.</div>
    </div>`;
  }
  const pAnalysis = analyzeResponse(primary.response_body, primary.stream_chunks);
  const sAnalysis = analyzeResponse(shadow.response_body, shadow.stream_chunks);
  const cmp = compareShadow(primary, shadow, pAnalysis);
  const cmpBlock = _renderShadowComparison(cmp);
  const pStatus = primary.status || (primary.error ? 'ERR' : 'pending');
  const sStatus = shadow.status || (shadow.error ? 'ERR' : 'pending');
  const pText = pAnalysis.content || '';
  const sText = sAnalysis.content || '';

  const colHtml = (label, model, status, ms, tokens, finishReason, text, analysis, kind) => `
    <div class="compare-col compare-${kind}">
      <div class="col-title">
        <h3>${esc(label)}</h3>
        <strong>${esc(model || '?')}</strong>
      </div>
      <div class="col-meta">
        <span>status <code>${esc(status)}</code></span>
        <span>${ms ? Math.round(ms) + ' ms' : '—'}</span>
        <span>${tokens}</span>
        <span>finish <code>${esc(finishReason || '?')}</code></span>
      </div>
      <h3>Assistant text (${num(text.length)} chars)</h3>
      <div class="text-pane ${text ? '' : 'empty'}">${text ? esc(text) : '(no text content — tool-only turn)'}</div>
      <h3 style="margin-top:10px">Tool calls (${analysis.tool_calls.length})</h3>
      ${_toolCardsHtml(analysis)}
    </div>`;

  const pTokensLine = `${num(primary.total_tokens || 0)} tok (p:${num(primary.prompt_tokens) || 0} / c:${num(primary.completion_tokens) || 0})`;
  const sTokensLine = `${num(shadow.total_tokens || 0)} tok (p:${num(shadow.prompt_tokens) || 0} / c:${num(shadow.completion_tokens) || 0})`;

  return `<div class="compare-view">
    <div class="compare-header">
      <button onclick="closeCompare()">← Back to request</button>
      <h2>🔀 Compare</h2>
      <span style="color:#888;font-size:12px">primary <code>${esc(primary.id.slice(0,8))}</code> · shadow <code>${esc(shadow.id.slice(0,8))}</code></span>
    </div>
    ${cmpBlock}
    <div class="compare-grid" style="margin-top:14px">
      ${colHtml('Primary', primary.model, pStatus, primary.duration_ms, pTokensLine, pAnalysis.finish_reason, pText, pAnalysis, 'primary')}
      ${colHtml('Shadow', shadow.model, sStatus, shadow.duration_ms, sTokensLine, sAnalysis.finish_reason, sText, sAnalysis, 'shadow')}
    </div>
    ${_toolPairsHtml(pAnalysis, sAnalysis)}
  </div>`;
}

function renderShadows(shadows, primary) {
  if (!shadows || !shadows.length) return '';
  // Compute primary analysis once and reuse for each shadow comparison.
  const primaryAnalysis = analyzeResponse(primary.response_body, primary.stream_chunks);
  const rows = shadows.map((s) => {
    const status = s.status || (s.error ? 'ERR' : 'pending');
    const cls = !s.status && !s.error ? 'shadow-status-pending'
              : s.error || (s.status >= 400) ? 'shadow-status-err' : 'shadow-status-ok';
    const ms = s.duration_ms ? Math.round(s.duration_ms) + ' ms' : '—';
    const tokens = s.total_tokens ? `${num(s.total_tokens)} tok (p:${num(s.prompt_tokens)||0} / c:${num(s.completion_tokens)||0})` : '—';
    const respText = _shadowResponseText(s);
    const errBlock = s.error ? `<pre style="margin-top:6px;color:#bf616a;max-height:120px">${esc(s.error)}</pre>` : '';
    const cmp = compareShadow(primary, s, primaryAnalysis);
    const cmpBlock = _renderShadowComparison(cmp);
    const respBlock = respText
      ? `<details style="margin-top:6px"><summary style="cursor:pointer;color:#888;font-size:11px">show response (${num(respText.length)} chars)</summary>
           <pre data-k="shadow-${esc(s.id)}-resp" style="max-height:300px">${esc(respText)}</pre></details>`
      : '<div style="margin-top:6px;color:#666;font-size:11px">(no response yet)</div>';
    const rawBlock = s.response_body
      ? `<details style="margin-top:4px"><summary style="cursor:pointer;color:#666;font-size:10px">raw upstream JSON</summary>
           <pre data-k="shadow-${esc(s.id)}-raw" style="max-height:240px;font-size:11px">${esc(tryPretty(s.response_body))}</pre></details>`
      : '';
    const compareBtn = (s.response_body || s.stream_chunks)
      ? ` &nbsp;<a href="#" style="color:#a3be8c;font-size:11px" onclick="event.preventDefault();openCompare('${esc(primary.id)}','${esc(s.id)}')">🔍 compare →</a>`
      : '';
    return `<div class="shadow-row">
      <div class="shadow-meta">
        <span><strong>${esc(s.model || '(?)')}</strong></span>
        <span class="${cls}">${esc(status)}</span>
        <span style="color:#888">${ms}</span>
        <span style="color:#888">${tokens}</span>
        <span style="color:#666;font-size:11px">${esc(s.upstream_url || '')}</span>
        <span style="margin-left:auto"><a href="#" style="color:#88c0d0;font-size:11px" onclick="event.preventDefault();selectItem('${esc(s.id)}')">open ${esc(s.id.slice(0,8))} →</a>${compareBtn}</span>
      </div>
      ${cmpBlock}
      ${errBlock}
      ${respBlock}
      ${rawBlock}
    </div>`;
  }).join('');
  return `<div class="shadow-section">
    <h3>🔀 Shadow runs (${shadows.length}) — primary model <code>${esc(primary.model || '?')}</code></h3>
    ${rows}
  </div>`;
}

async function loadDetail(id) {
  const r = await fetch('/__proxy/api/requests/' + id);
  if (!r.ok) { $('detail').innerHTML = '<div class="empty">not found</div>'; lastDetailSig = null; return; }
  const d = await r.json();

  // Compare view: render the side-by-side comparison and exit early.
  if (compareView && compareView.primaryId === d.id) {
    const shadow = (d.shadows || []).find(s => s.id === compareView.shadowId);
    const sig = `compare|${d.id}|${compareView.shadowId}|${(d.response_body || '').length}|${(d.stream_chunks || '').length}|${shadow ? shadow.status || 'p' : 'none'}|${shadow ? (shadow.response_body || '').length : 0}`;
    if (sig === lastDetailSig) return;
    $('detail').innerHTML = _renderCompareView(d, shadow);
    lastDetailSig = sig;
    return;
  }

  // Skip re-render if nothing the user can see has changed; preserves scroll position during auto-refresh.
  const shadowSig = (d.shadows || []).map(s => `${s.id}:${s.status || 'p'}:${(s.response_body || '').length}:${s.duration_ms || 0}`).join(';');
  const sig = [
    d.id, d.status, d.error || '',
    (d.response_body || '').length,
    (d.stream_chunks || '').length,
    d.duration_ms || 0,
    d.total_tokens || 0,
    shadowSig,
  ].join('|');
  if (sig === lastDetailSig) return;

  // Capture scroll positions before re-render so the user doesn't get yanked to the top.
  const detailEl = $('detail');
  const prevScroll = detailEl.scrollTop;
  const preScrolls = {};
  detailEl.querySelectorAll('pre').forEach(p => {
    if (p.dataset.k) preScrolls[p.dataset.k] = { top: p.scrollTop, left: p.scrollLeft };
  });

  const reqHeaders = tryPretty(d.request_headers);
  const reqBody = tryPretty(d.request_body);
  const respHeaders = tryPretty(d.response_headers);
  let respSection = '';

  if (d.is_stream || d.stream_chunks) {
    const reconstructed = reconstructStream(d.stream_chunks || '');
    respSection = `
      ${reconstructed ? `<div class="section"><h3>Reconstructed Assistant Output</h3><pre class="reconstructed stream-text" data-k="reconstructed">${esc(reconstructed)}</pre></div>` : ''}
      <div class="section"><h3>Stream Chunks (SSE)</h3><pre data-k="stream">${esc(renderSSE(d.stream_chunks || ''))}</pre></div>
    `;
  } else {
    respSection = `<div class="section"><h3>Response Body</h3><pre data-k="resp">${esc(tryPretty(d.response_body))}</pre></div>`;
  }

  const errBlock = d.error ? `<div class="section"><h3>Error</h3><pre class="status-5" data-k="err">${esc(d.error)}</pre></div>` : '';
  const status = d.status || (d.error ? 'ERR' : 'pending');

  const tokensLine = (d.prompt_tokens != null || d.completion_tokens != null || d.total_tokens != null)
    ? `<div class="row"><span class="label">Tokens</span> prompt: <code>${num(d.prompt_tokens) || '—'}</code> · completion: <code>${num(d.completion_tokens) || '—'}</code> · total: <code>${num(d.total_tokens) || '—'}</code></div>`
    : '';
  let downsizeLine = '';
  if (d.downsize_score != null) {
    const s = d.downsize_score;
    const filled = Math.round(s / 10);
    const bar = '●'.repeat(filled) + '○'.repeat(10 - filled);
    const color = s >= 70 ? '#a3be8c' : s >= 40 ? '#ebcb8b' : '#888';
    const reasons = (d.downsize_reasons || []).join(' · ') || 'no signals';
    downsizeLine = `<div class="row"><span class="label">Downsize</span> <span style="color:${color};font-family:ui-monospace,monospace">${bar}</span> <code>${s}/100</code> <span style="color:#888;font-size:11px" title="${esc(reasons)}">${esc(reasons)}</span></div>`;
  }

  const analysisHtml = renderAnalysis(d);

  let gateHtml = '';
  if (d.gate_verdict === 'block' || d.gate_verdict === 'warn' || d.gate_verdict === 'rewrite' || d.gate_verdict === 'intercept') {
    let detailsBlock = '';
    let parsed = null;
    if (d.gate_details) {
      try { parsed = JSON.parse(d.gate_details); } catch {}
      const pretty = parsed ? JSON.stringify(parsed, null, 2) : d.gate_details;
      detailsBlock = `<pre data-k="gate-details" style="margin-top:8px;max-height:200px">${esc(pretty)}</pre>`;
    }
    let routedLine = '';
    if (parsed) {
      if (parsed.rewrite) {
        const r = parsed.rewrite;
        routedLine += `<div style="margin-top:6px;font-size:14px"><strong>model:</strong> <code>${esc(r.from)}</code> &nbsp;→&nbsp; <code style="color:#88c0d0">${esc(r.to)}</code> <span class="badge">via ${esc(r.via || '')}</span></div>`;
      }
      if (parsed.options && parsed.options.applied) {
        const apps = parsed.options.applied;
        const kvs = Object.entries(apps).map(([k, v]) => `<code>${esc(k)}=${esc(JSON.stringify(v))}</code>`).join(' &nbsp;');
        routedLine += `<div style="margin-top:6px;font-size:13px"><strong style="color:#88c0d0">options injected:</strong> ${kvs}</div>`;
      }
      if (parsed.fixes && Array.isArray(parsed.fixes) && parsed.fixes.length) {
        const fixSummary = parsed.fixes.map(f => `<code>${esc(f.tool_name)}</code> ← {${Object.entries(f.fixed_fields || {}).map(([k, v]) => `${esc(k)}: ${esc(JSON.stringify(v))}`).join(', ')}}`).join('; ');
        routedLine += `<div style="margin-top:6px;font-size:13px"><strong style="color:#88c0d0">tool args autofixed:</strong> ${fixSummary}</div>`;
      }
    }
    const cls = d.gate_verdict === 'block' ? 'gate-block'
              : d.gate_verdict === 'warn' ? 'gate-warn'
              : d.gate_verdict === 'rewrite' ? 'gate-rewrite'
              : 'gate-intercept';
    gateHtml = `<div class="${cls}">
      <div><span class="verdict ${d.gate_verdict}">${esc(d.gate_verdict)}</span> · rule: <code>${esc(d.gate_rule || '')}</code></div>
      <div style="margin-top:6px">${esc(d.gate_reason || '')}</div>
      ${routedLine}
      ${detailsBlock}
    </div>`;
  } else if (d.gate_verdict === 'allow') {
    gateHtml = `<div class="gate-allow"><span class="verdict allow">allow</span> · no rule fired</div>`;
  }

  // If this row is itself a shadow, show a banner linking back to its primary.
  const shadowBackBanner = d.shadow_of
    ? `<div class="shadow-back-banner">🔀 This is a shadow run of <a href="#" onclick="event.preventDefault();selectItem('${esc(d.shadow_of)}')">${esc(d.shadow_of)}</a> — comparison only, not delivered to the client.</div>`
    : '';
  const shadowsHtml = renderShadows(d.shadows || [], d);

  detailEl.innerHTML = `
    ${shadowBackBanner}
    <div class="summary">
      <div class="row"><span class="label">Request</span> <strong class="method">${esc(d.method)}</strong> <code>${esc(d.path)}</code></div>
      <div class="row"><span class="label">Client</span> <code>${esc(d.client_ip || '(unknown)')}</code>${d.client_app ? ` <span class="app-badge app-${esc(d.client_app)}">${esc(d.client_app)}</span>` : ''}</div>
      <div class="row"><span class="label">Upstream</span> <code>${esc(d.upstream_url)}</code></div>
      <div class="row"><span class="label">Status</span> <span class="status-${String(status)[0]}">${esc(status)}</span> · ${d.duration_ms ? Math.round(d.duration_ms) + ' ms' : '—'}${d.is_stream ? ' · <span class="badge">SSE</span>' : ''}</div>
      <div class="row"><span class="label">Model</span> <code>${esc(d.model || '(none)')}</code></div>
      ${tokensLine}
      ${downsizeLine}
    </div>
    ${gateHtml}
    ${errBlock}
    ${shadowsHtml}
    ${analysisHtml}
    <div class="section"><h3>Request Headers</h3><details><summary style="cursor:pointer;color:#888;font-size:11px">show</summary><pre data-k="reqh">${esc(reqHeaders)}</pre></details></div>
    <div class="section"><h3>Request Body (raw)</h3><details open><summary style="cursor:pointer;color:#888;font-size:11px">hide</summary><pre data-k="reqb">${esc(reqBody)}</pre></details></div>
    <div class="section"><h3>Response Headers</h3><details><summary style="cursor:pointer;color:#888;font-size:11px">show</summary><pre data-k="resph">${esc(respHeaders)}</pre></details></div>
    ${respSection}
  `;

  // Restore scroll positions.
  detailEl.scrollTop = prevScroll;
  detailEl.querySelectorAll('pre').forEach(p => {
    const s = p.dataset.k && preScrolls[p.dataset.k];
    if (s) { p.scrollTop = s.top; p.scrollLeft = s.left; }
  });

  lastDetailSig = sig;
}

async function clearAll() {
  if (!confirm('Clear all captured requests?')) return;
  await fetch('/__proxy/api/clear', { method: 'POST' });
  selected = null;
  lastDetailSig = null;
  $('detail').innerHTML = '<div class="empty">Select a request to inspect</div>';
  await refresh();
  if (view === 'stats') await loadStats();
}

function _renderTrafficFlow(stats, rules, audit) {
  const apps = (stats.by_app || []).slice().sort((a, b) => b.count - a.count);
  const cfg = (rules && rules.config) || {};
  const auditCounts = {};
  for (const ev of (audit && audit.items) || []) {
    const rule = ev.gate_rule || '?';
    // gate_rule can be combined like "model_router+protocol_bridge" — count each component.
    for (const r of rule.split('+')) {
      auditCounts[r] = (auditCounts[r] || 0) + 1;
    }
  }
  // Aggregate paths into upstream buckets.
  const upstreams = { Anthropic: { reqs: 0, tokens: 0, ms_total: 0 }, 'Ollama (local)': { reqs: 0, tokens: 0, ms_total: 0 }, Other: { reqs: 0, tokens: 0, ms_total: 0 } };
  for (const p of (stats.by_path || [])) {
    let key = 'Other';
    if (p.path && (p.path.startsWith('/v1/messages') || p.path.startsWith('/v1/complete'))) key = 'Anthropic';
    else if (p.path && (p.path.startsWith('/v1/') || p.path.startsWith('/api/'))) key = 'Ollama (local)';
    upstreams[key].reqs += p.count || 0;
    upstreams[key].tokens += p.total_tokens || 0;
    upstreams[key].ms_total += (p.avg_ms || 0) * (p.count || 0);
  }
  // Most-recently-active first.
  const clientCards = apps.length ? apps.map(a => {
    const live = (Date.now() / 1000 - (a.last_ts || 0)) < 60 ? 'flow-card-live' : '';
    const ago = a.last_ts ? _agoShort(Date.now() / 1000 - a.last_ts) : '—';
    return `<div class="flow-card ${live}">
      <div class="flow-card-name"><span class="app-badge app-${esc(a.client_app)}">${esc(a.client_app)}</span></div>
      <div class="flow-card-stat"><strong>${num(a.count)}</strong> reqs · <strong>${num(a.total_tokens)}</strong> tok</div>
      <div class="flow-card-stat" style="font-size:10px">avg ${(a.avg_ms / 1000).toFixed(1)}s · ${esc(ago)} ago</div>
    </div>`;
  }).join('') : '<div class="flow-card" style="color:#666">no clients yet</div>';

  // Pipeline rules in execution order. Activation count from audit (best-effort match).
  const ruleOrder = [
    'model_router', 'ollama_options', 'protocol_bridge', 'tool_pruner', 'context_overflow_guard',
    'shadow_router', 'loop_detector', 'tool_failure_breaker',
    'schema_validator', 'hallucinated_tool', 'tool_args_autofix',
  ];
  const ruleHtml = ruleOrder.map(name => {
    const rcfg = cfg[name] || {};
    const enabled = !!rcfg.enabled;
    const count = auditCounts[name] || 0;
    return `<div class="flow-rule ${enabled ? '' : 'is-off'}">
      <span class="rule-dot ${enabled ? 'on' : 'off'}"></span>
      <span class="rule-name">${esc(name)}</span>
      <span class="rule-count ${count === 0 ? 'zero' : ''}">${count ? num(count) + ' fired' : (enabled ? 'idle' : 'off')}</span>
    </div>`;
  }).join('');

  const upstreamCards = Object.entries(upstreams).filter(([, v]) => v.reqs > 0).map(([name, v]) => {
    const avg = v.reqs > 0 ? Math.round(v.ms_total / v.reqs) : 0;
    return `<div class="flow-card">
      <div class="flow-card-name"><strong>${esc(name)}</strong></div>
      <div class="flow-card-stat"><strong>${num(v.reqs)}</strong> reqs · <strong>${num(v.tokens)}</strong> tok</div>
      <div class="flow-card-stat" style="font-size:10px">avg ${avg < 1000 ? avg + ' ms' : (avg / 1000).toFixed(1) + ' s'}</div>
    </div>`;
  }).join('') || '<div class="flow-card" style="color:#666">no upstream traffic yet</div>';

  const totalReqs = (stats.overall && stats.overall.count) || 0;
  const totalTok = (stats.overall && stats.overall.total_tokens) || 0;
  const blocks = (audit && audit.counts && audit.counts.block) || 0;
  const intercepts = (audit && audit.counts && audit.counts.intercept) || 0;
  const rewrites = (audit && audit.counts && audit.counts.rewrite) || 0;

  return `<div class="flow-section">
    <h2>🔀 Traffic Flow <span style="color:#666;font-weight:normal;font-size:10px;margin-left:8px">live · refreshes every 1.5s</span></h2>
    <div class="flow-grid">
      <div class="flow-col flow-col-clients">
        <div class="flow-col-title">CLIENTS (${apps.length})</div>
        ${clientCards}
      </div>
      <div class="flow-arrow-col"><div><div class="flow-arrow">→</div><div class="flow-arrow-label">${num(totalReqs)} req<br>${num(totalTok)} tok</div></div></div>
      <div class="flow-col flow-col-proxy">
        <div class="flow-col-title">AI PROXY · rule pipeline</div>
        ${ruleHtml}
        <div class="flow-totals">
          <span><strong>${num(blocks)}</strong> blocks</span>
          <span><strong>${num(intercepts)}</strong> intercepts</span>
          <span><strong>${num(rewrites)}</strong> rewrites</span>
        </div>
      </div>
      <div class="flow-arrow-col"><div><div class="flow-arrow">→</div><div class="flow-arrow-label">to upstream</div></div></div>
      <div class="flow-col flow-col-upstreams">
        <div class="flow-col-title">UPSTREAMS</div>
        ${upstreamCards}
      </div>
    </div>
  </div>`;
}

function _agoShort(s) {
  if (s < 60) return Math.round(s) + 's';
  if (s < 3600) return Math.round(s / 60) + 'm';
  if (s < 86400) return (s / 3600).toFixed(1) + 'h';
  return (s / 86400).toFixed(1) + 'd';
}

async function loadStats() {
  const [d, rules, audit] = await Promise.all([
    fetch('/__proxy/api/stats').then(r => r.json()),
    fetch('/__proxy/api/rules').then(r => r.json()).catch(() => null),
    fetch('/__proxy/api/audit?include_allow=true').then(r => r.json()).catch(() => null),
  ]);
  const flowHtml = _renderTrafficFlow(d, rules, audit);
  const o = d.overall || {};
  const span = (o.first_ts && o.last_ts) ? Math.max(1, o.last_ts - o.first_ts) : 0;
  const cards = `
    <div class="cards">
      <div class="card"><div class="l">Requests</div><div class="v">${num(o.count || 0)}</div><div class="s">${num(o.errors || 0)} errors · ${num(o.streams || 0)} streamed</div></div>
      <div class="card"><div class="l">Total Tokens</div><div class="v">${num(o.total_tokens || 0)}</div><div class="s">prompt ${num(o.prompt_tokens || 0)} · completion ${num(o.completion_tokens || 0)}</div></div>
      <div class="card"><div class="l">Avg Latency</div><div class="v">${Math.round(o.avg_ms || 0)}<span style="font-size:14px;color:#888"> ms</span></div><div class="s">total ${(((o.total_ms || 0)/1000).toFixed(1))}s upstream time</div></div>
      <div class="card"><div class="l">Window</div><div class="v" style="font-size:14px">${span ? fmtSpan(span) : '—'}</div><div class="s">${o.first_ts ? new Date(o.first_ts*1000).toLocaleString() : ''}</div></div>
    </div>`;

  const maxModelTokens = Math.max(1, ...d.by_model.map(m => m.total_tokens || 0));
  const modelRows = d.by_model.length ? d.by_model.map(m => {
    const w = Math.round(80 * (m.total_tokens || 0) / maxModelTokens);
    const compTokens = m.completion_tokens || 0;
    const totalMs = m.total_ms || 0;
    const tokensPerSec = totalMs > 0 && compTokens > 0 ? (compTokens / (totalMs / 1000)).toFixed(1) : '—';
    const msPer1k = compTokens > 0 ? Math.round((totalMs / compTokens) * 1000) : '—';
    return `<tr>
      <td><code>${esc(m.model)}</code></td>
      <td class="num">${num(m.count)}</td>
      <td class="num">${num(m.prompt_tokens)}</td>
      <td class="num">${num(m.completion_tokens)}</td>
      <td class="num"><span class="bar" style="width:${w}px"></span>${num(m.total_tokens)}</td>
      <td class="num">${Math.round(m.avg_ms || 0)}</td>
      <td class="num" title="completion tokens per second">${tokensPerSec}</td>
      <td class="num" title="ms to generate 1,000 completion tokens">${msPer1k === '—' ? '—' : num(msPer1k)}</td>
      <td class="num">${num(m.errors || 0)}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="9" class="empty">No data yet</td></tr>';

  const pathRows = d.by_path.length ? d.by_path.map(p => `
    <tr><td><code>${esc(p.path)}</code></td><td class="num">${num(p.count)}</td><td class="num">${num(p.total_tokens)}</td><td class="num">${Math.round(p.avg_ms || 0)}</td></tr>
  `).join('') : '<tr><td colspan="4" class="empty">No data yet</td></tr>';

  const statusRows = d.by_status.length ? d.by_status.map(s => {
    const code = s.status || 'ERR';

  const apps = d.by_app || [];

    const modelsSeen = (a.models_seen || '').split(',').filter(Boolean).slice(0, 4).map(m => `<code style="font-size:10px;color:#888">${esc(m)}</code>`).join(' ');

  const tools = d.by_tool || [];
  const toolRows = tools.length ? tools.map(t => {
    const byModel = Object.entries(t.by_model || {}).map(([m, n]) => `<code style="font-size:11px">${esc(m)}</code>:${num(n)}`).join(' · ') || '—';
    return `<tr><td><code>${esc(t.name)}</code></td><td class="num">${num(t.calls)}</td><td>${byModel}</td></tr>`;
  }).join('') : '<tr><td colspan="3" class="empty">No tool calls observed yet</td></tr>';

  $('stats').innerHTML = `
    ${flowHtml}

    <div class="stats-section">
      <h2>By Model</h2>
      <table style="width:100%">
        <thead><tr><th>Model</th><th class="num">Requests</th><th class="num">Prompt</th><th class="num">Completion</th><th class="num">Total Tokens</th><th class="num">Avg ms</th><th class="num" title="completion tokens per second">tok/s</th><th class="num" title="ms to generate 1,000 completion tokens">ms/1k</th><th class="num">Errors</th></tr></thead>

    <div class="stats-section">
