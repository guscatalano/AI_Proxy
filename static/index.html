function _conversationTurnSummary(t, body, userText, assistantText, toolCalls, toolResults) {
  // One-line scan: short user message OR what the assistant did this turn.
  let snippet = '';
  if (userText) {
    snippet = userText.replace(/\s+/g, ' ').slice(0, 100);
  } else if (toolResults.length) {
    snippet = `↩ ${toolResults.length} tool result${toolResults.length === 1 ? '' : 's'}`;
  }
  let outcome = '';
  if (toolCalls.length) {
    outcome = ` 🔧 ${toolCalls.map(tc => tc.name || '?').slice(0, 3).join(', ')}${toolCalls.length > 3 ? ` +${toolCalls.length - 3}` : ''}`;
  } else if (assistantText) {
    const assistSnip = assistantText.replace(/\s+/g, ' ').slice(0, 80);
    outcome = ` 💬 ${assistSnip}${assistantText.length > 80 ? '…' : ''}`;
  }
  return { snippet, outcome };
}

async function loadConversationDetail(cid) {
  const d = await (await fetch('/__proxy/api/conversations/' + encodeURIComponent(cid))).json();
  const turns = d.turns || [];
  // Auto-expand last 3 turns on long conversations; expand all on short ones.
  const longConv = turns.length > 8;
  const expandedSet = new Set();
  if (!longConv) {
    turns.forEach((_, i) => expandedSet.add(i));
  } else {
    for (let i = Math.max(0, turns.length - 3); i < turns.length; i++) expandedSet.add(i);
  }

  // First pass: compute per-turn metadata so both TOC and turn list render from one source.
  const meta = turns.map((t) => {
    let body = null;
    try { body = JSON.parse(t.request_body || ''); } catch {}
    const userMsgs = (body && body.messages || []).filter(m => m && m.role === 'user');
    const lastUser = userMsgs[userMsgs.length - 1];
    const userText = lastUser ? (typeof lastUser.content === 'string' ? lastUser.content : JSON.stringify(lastUser.content)) : '';

    let assistantText = '';
    let toolCalls = [];
    if (t.stream_chunks) {
      assistantText = reconstructStream(t.stream_chunks);
      const a = analyzeResponse(null, t.stream_chunks);
      toolCalls = a.tool_calls;
    } else if (t.response_body) {
      const a = analyzeResponse(t.response_body, null);
      assistantText = a.content;
      toolCalls = a.tool_calls;
    }

    const allMsgs = (body && body.messages) || [];
    const tcMap = {};
    for (const m of allMsgs) {
      if (m && m.role === 'assistant' && Array.isArray(m.tool_calls)) {
        for (const tc of m.tool_calls) {
          if (tc && tc.id && tc.function) {
            tcMap[tc.id] = { name: tc.function.name, args: tc.function.arguments };
          }
        }
      }
    }
    const toolResults = allMsgs.filter(m => m && m.role === 'tool').map(m => ({
      ...m,
      _call: m.tool_call_id ? tcMap[m.tool_call_id] : null,
    }));
    const hasError = toolResults.some(tr => {
      const c = typeof tr.content === 'string' ? tr.content : JSON.stringify(tr.content || '');
      return looksLikeToolError(c).isError;
    });
    return { t, body, userText, assistantText, toolCalls, toolResults, hasError, hasTool: toolCalls.length > 0 };
  });

  const turnHtml = meta.map((m, i) => {
    const { t, body, userText, assistantText, toolCalls, toolResults, hasError, hasTool } = m;

    let verdictBadge = '';
    if (t.gate_verdict && t.gate_verdict !== 'allow') {
      verdictBadge = ` <span class="verdict ${esc(t.gate_verdict)}">${esc(t.gate_verdict)}${t.gate_rule ? ' · ' + esc(t.gate_rule) : ''}</span>`;
    }

    const tcHtml = toolCalls.length ? toolCalls.map(tc => {
      let pretty = tc.arguments;
      try { pretty = JSON.stringify(JSON.parse(tc.arguments), null, 2); } catch {}
      return `<details style="margin:4px 0"><summary style="font-size:11px;cursor:pointer">🔧 <code>${esc(tc.name)}</code></summary><pre style="font-size:11px;max-height:160px">${esc(pretty)}</pre></details>`;
    }).join('') : '';

    const trHtml = toolResults.length ? toolResults.map(tr => {
      const contentStr = typeof tr.content === 'string' ? tr.content : JSON.stringify(tr.content || '');
      const er = looksLikeToolError(contentStr);
      const cls = er.isError ? 'msg tool tool-error-msg' : 'msg tool';
      const summaryCls = er.isError ? 'tool-error-summary' : '';
      const excerpt = er.isError ? `<span class="tool-error-excerpt">${esc(er.excerpt || '')}</span>` : '';
      const callName = (tr._call && tr._call.name) || tr.name || tr.tool_call_id || '?';
      let argsHtml = '';
      if (tr._call && tr._call.args) {
        let argsPretty = tr._call.args;
        try { argsPretty = JSON.stringify(JSON.parse(tr._call.args), null, 2); } catch {}
        argsHtml = `<div style="margin:6px 0 2px 0;font-size:10px;color:#88c0d0;text-transform:uppercase;letter-spacing:0.5px">→ called with</div><pre style="font-size:11px;max-height:160px;margin:0 0 4px 0">${esc(argsPretty)}</pre><div style="margin:0 0 2px 0;font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:0.5px">→ returned</div>`;
      }
      return `<details class="${cls}" style="margin:4px 0"><summary class="${summaryCls}" style="font-size:11px;cursor:pointer">🔧 <code>${esc(callName)}</code>${argsHtml ? '' : ' (result)'}${excerpt}</summary>
        ${argsHtml}<pre style="font-size:11px;max-height:160px;margin-top:0">${esc(contentStr.slice(0, 4000))}</pre>
      </details>`;
    }).join('') : '';

    const sum = _conversationTurnSummary(t, body, userText, assistantText, toolCalls, toolResults);
    const isOpen = expandedSet.has(i);
    const summaryLine = `<span style="color:#888;font-size:11px">${esc(sum.snippet || '(no user msg)')}</span>${sum.outcome ? `<span style="color:#aaa;font-size:11px">${esc(sum.outcome)}</span>` : ''}`;
    return `<details id="turn-${i}" class="turn" data-turn-idx="${i}" data-has-error="${hasError ? 1 : 0}" data-has-tool="${hasTool ? 1 : 0}" ${isOpen ? 'open' : ''}>
      <summary class="turn-header" style="cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px">
        <span style="color:#888;font-size:10px;width:10px">▸</span>
        <strong>Turn ${i + 1}</strong>${t.turn_index && t.turn_index !== (i + 1) ? `<span style="color:#666;font-size:10px"> (msg #${num(t.turn_index)})</span>` : ''}
        <span>· ${fmt(t.ts)}</span>
        <span>· <code>${esc(t.model || '')}</code></span>
        <span>· ${num(t.total_tokens || 0)} tok</span>
        <span>· ${Math.round(t.duration_ms || 0)}ms</span>
        ${verdictBadge}
        <span style="flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${summaryLine}</span>
        <a href="#" onclick="event.preventDefault();event.stopPropagation();setView('requests');selectItem('${esc(t.id)}')" style="color:#88c0d0;font-size:11px;margin-left:auto">open ${esc(t.id.slice(0,8))}</a>
      </summary>
      <div style="margin-top:8px">
        ${trHtml}
        ${userText ? `<div class="msg user"><div class="role">user</div>${esc(userText.slice(0, 4000))}${userText.length > 4000 ? '\n…' : ''}</div>` : ''}
        ${assistantText ? `<div class="msg assistant"><div class="role">assistant</div>${esc(assistantText.slice(0, 4000))}${assistantText.length > 4000 ? '\n…' : ''}</div>` : ''}
        ${tcHtml}
      </div>
    </details>`;
  }).join('');

  const tocHtml = meta.map((m, i) => {
    const { t, userText, assistantText, toolCalls, toolResults, hasError, hasTool } = m;
    const sum = _conversationTurnSummary(t, m.body, userText, assistantText, toolCalls, toolResults);
    const snippet = sum.snippet || sum.outcome.replace(/^[^A-Za-z0-9]+/, '') || '(no msg)';
    const verdict = t.gate_verdict && t.gate_verdict !== 'allow' ? t.gate_verdict : '';
    const icons = [
      hasTool ? `🔧${toolCalls.length}` : '',
      hasError ? `<span class="err">⚠</span>` : '',
      verdict ? `<span class="verdict ${esc(verdict)}" style="font-size:9px;padding:0 4px">${esc(verdict[0].toUpperCase())}</span>` : '',
    ].filter(Boolean).join(' ');
    return `<li><a href="#" class="conv-toc-item" data-turn-idx="${i}" data-has-error="${hasError ? 1 : 0}" data-has-tool="${hasTool ? 1 : 0}" title="${esc(snippet)}">
      <span class="toc-num">T${i + 1}</span>
      <span class="toc-snippet">${esc(snippet)}</span>
      <span class="toc-icons">${icons}</span>
    </a></li>`;
  }).join('');

  const layout = turns.length > 1 ? `
    <div class="conv-layout">
      <aside class="conv-toc">
        <div class="conv-toc-controls">
          <input type="text" placeholder="Search turns…" oninput="convSearch(this.value)">
          <div class="conv-filter-row">
            <button data-filter="all" class="active" onclick="convFilter('all', this)">All</button>
            <button data-filter="error" onclick="convFilter('error', this)">⚠ Errors</button>
            <button data-filter="tool" onclick="convFilter('tool', this)">🔧 Tools</button>
          </div>
          <div class="conv-jump-row">
            <button onclick="convJumpTop()" title="Scroll to top">↑ Top</button>
            <button onclick="convJumpError()" title="Jump to next error">⚠ Next err</button>
            <button onclick="convToggleAll('${esc(cid)}', true)" title="Expand all turns">＋ All</button>
            <button onclick="convToggleAll('${esc(cid)}', false)" title="Collapse all turns">－ All</button>
          </div>
          <div class="conv-toc-pager"></div>
        </div>
        <ol class="conv-toc-list">${tocHtml}</ol>
      </aside>
      <div class="conv-turns">
        <div class="conv-pager"></div>
        ${turnHtml}
      </div>
    </div>
  ` : turnHtml;

  $('conv-detail').innerHTML = `
    <div class="stats-section">
      <h2>Conversation <code style="font-size:13px">${esc(cid)}</code> · ${turns.length} turn${turns.length === 1 ? '' : 's'}</h2>
      ${layout}
    </div>
  `;
  for (const a of $('conv-detail').querySelectorAll('.conv-toc-item')) {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      convJumpTo(+a.dataset.turnIdx);
    });
  }
  // Initialize pagination state. Default to last page so most-recent turns are visible.
  _convState = { cid, perPage: 25, page: 0, filter: 'all', search: '', total: turns.length };
  if (turns.length > _convState.perPage) {
    _convState.page = Math.ceil(turns.length / _convState.perPage) - 1;
  }
  _applyConvVisibility();
  _convSetupScrollSpy();
  $('conv-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

let _convState = null;

function _convMatches(el, filter, q) {
  if (filter === 'error' && el.dataset.hasError !== '1') return false;
  if (filter === 'tool' && el.dataset.hasTool !== '1') return false;
  if (q && !((el.textContent || '').toLowerCase().includes(q))) return false;
  return true;
}

function _applyConvVisibility() {
  if (!_convState) return;
  const root = $('conv-detail');
  if (!root) return;
  const { perPage, page, filter, search } = _convState;
  const q = (search || '').trim().toLowerCase();
  const turnEls = [...root.querySelectorAll('details.turn')];
  const tocItems = [...root.querySelectorAll('.conv-toc-item')];

  const matchIdxs = [];
  turnEls.forEach((el, i) => { if (_convMatches(el, filter, q)) matchIdxs.push(i); });

  const totalPages = Math.max(1, Math.ceil(matchIdxs.length / perPage));
  if (_convState.page >= totalPages) _convState.page = totalPages - 1;
  if (_convState.page < 0) _convState.page = 0;
  const curPage = _convState.page;
  const start = curPage * perPage;
  const visibleIdxs = new Set(matchIdxs.slice(start, start + perPage));

  turnEls.forEach((el, i) => { el.style.display = visibleIdxs.has(i) ? '' : 'none'; });
  tocItems.forEach(a => {
    const i = +a.dataset.turnIdx;
    const matched = matchIdxs.includes(i);
    a.parentElement.style.display = matched ? '' : 'none';
    a.classList.toggle('off-page', matched && !visibleIdxs.has(i));
  });

  const pager = root.querySelector('.conv-pager');
  if (pager) {
    if (matchIdxs.length <= perPage) {
      pager.style.display = 'none';
      pager.innerHTML = '';
    } else {
      pager.style.display = '';
      pager.innerHTML = _convPagerHtml(curPage, totalPages, matchIdxs.length, perPage);
      for (const b of pager.querySelectorAll('button[data-page]')) {
        b.addEventListener('click', () => { _convGoToPage(+b.dataset.page); });
      }
      const sel = pager.querySelector('select.per-page');
      if (sel) sel.addEventListener('change', () => {
        _convState.perPage = +sel.value;
        _convState.page = 0;
        _applyConvVisibility();
      });
    }
  }
  const tocPager = root.querySelector('.conv-toc-pager');
  if (tocPager) {
    tocPager.textContent = totalPages > 1 ? `Page ${curPage + 1} / ${totalPages} · ${matchIdxs.length} turn${matchIdxs.length === 1 ? '' : 's'}` : '';
  }
}

function _convGoToPage(p) {
  if (!_convState) return;
  _convState.page = p;
  _applyConvVisibility();
  const first = $('conv-detail').querySelector('details.turn:not([style*="display: none"])');
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function _convPagerHtml(page, totalPages, totalMatches, perPage) {
  const pages = [];
  for (let i = 0; i < totalPages; i++) {
    if (i < 2 || i >= totalPages - 2 || Math.abs(i - page) <= 1) {
      pages.push(i);
    } else if (pages[pages.length - 1] !== '…') {
      pages.push('…');
    }
  }
  const btns = pages.map(p => p === '…'
    ? `<span class="pager-gap">…</span>`
    : `<button data-page="${p}" class="${p === page ? 'active' : ''}">${p + 1}</button>`).join('');
  const perPageSel = `<select class="per-page" title="Turns per page">
    ${[10, 25, 50, 100].map(n => `<option value="${n}" ${n === perPage ? 'selected' : ''}>${n}/page</option>`).join('')}
  </select>`;
  return `
    <button data-page="${Math.max(0, page - 1)}" ${page === 0 ? 'disabled' : ''}>« Prev</button>
    ${btns}
    <button data-page="${Math.min(totalPages - 1, page + 1)}" ${page >= totalPages - 1 ? 'disabled' : ''}>Next »</button>
    ${perPageSel}
    <span class="pager-info">${totalMatches} match${totalMatches === 1 ? '' : 'es'}</span>
  `;
}

function convToggleAll(cid, open) {
  for (const el of $('conv-detail').querySelectorAll('details.turn')) {
    if (open) el.setAttribute('open', '');
    else el.removeAttribute('open');
  }
}

function convJumpTo(i) {
  // If the target is filtered out or on a different page, switch first.
  if (_convState) {
    const root = $('conv-detail');
    const turnEls = [...root.querySelectorAll('details.turn')];
    const q = (_convState.search || '').trim().toLowerCase();
    const matchIdxs = [];
    turnEls.forEach((el, j) => { if (_convMatches(el, _convState.filter, q)) matchIdxs.push(j); });
    let pos = matchIdxs.indexOf(i);
    if (pos < 0) {
      // Target doesn't match current filter — clear filter and search to reveal it.
      _convState.filter = 'all';
      _convState.search = '';
      const si = root.querySelector('.conv-toc-controls input');
      if (si) si.value = '';
      for (const b of root.querySelectorAll('.conv-filter-row button')) b.classList.toggle('active', b.dataset.filter === 'all');
      pos = i;
    }
    const targetPage = Math.floor(pos / _convState.perPage);
    if (targetPage !== _convState.page) {
      _convState.page = targetPage;
    }
    _applyConvVisibility();
  }
  const el = document.getElementById(`turn-${i}`);
  if (!el) return;
  el.setAttribute('open', '');
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.remove('turn-flash');
  void el.offsetWidth;
  el.classList.add('turn-flash');
  setTimeout(() => el.classList.remove('turn-flash'), 1000);
}

function convJumpTop() {
  const scroller = $('convs');
  if (scroller) scroller.scrollTo({ top: 0, behavior: 'smooth' });
}

function convJumpError() {
  const errs = [...document.querySelectorAll('#conv-detail details.turn[data-has-error="1"]')];
  if (!errs.length) return;
  const scroller = $('convs');
  const sTop = scroller ? scroller.getBoundingClientRect().top : 0;
  const next = errs.find(el => el.getBoundingClientRect().top > sTop + 60) || errs[0];
  convJumpTo(+next.dataset.turnIdx);
}

function convFilter(kind, btn) {
  if (!_convState) return;
  _convState.filter = kind;
  _convState.page = 0;
  if (btn) {
    for (const b of $('conv-detail').querySelectorAll('.conv-filter-row button')) b.classList.toggle('active', b === btn);
  }
  _applyConvVisibility();
}

function convSearch(q) {
  if (!_convState) return;
  _convState.search = q || '';
  _convState.page = 0;
  _applyConvVisibility();
}

function _convSetupScrollSpy() {
  const root = $('conv-detail');
  const scroller = $('convs');
  if (!root || !scroller) return;
  const turns = [...root.querySelectorAll('details.turn')];
  const tocItems = [...root.querySelectorAll('.conv-toc-item')];
  if (!turns.length || !tocItems.length) return;
  const update = () => {
    const threshold = scroller.getBoundingClientRect().top + 80;
    let activeIdx = turns[0].dataset.turnIdx;
    for (const el of turns) {
      if (el.style.display === 'none') continue;
      if (el.getBoundingClientRect().top <= threshold) activeIdx = el.dataset.turnIdx;
      else break;
    }
    for (const a of tocItems) a.classList.toggle('current', a.dataset.turnIdx === activeIdx);
  };
  // Replace any prior listener so re-renders don't pile up.
  if (scroller._convSpy) scroller.removeEventListener('scroll', scroller._convSpy);
  scroller._convSpy = update;
  scroller.addEventListener('scroll', update, { passive: true });
  update();
}

let rulesEditorBaseline = '';

function markRulesDirty() {
  const ta = $('rules-json');
  if (!ta) return;
  ta.classList.toggle('dirty', ta.value !== rulesEditorBaseline);
  setRulesStatus('', '');
}

function setRulesStatus(msg, kind) {
  const el = $('rules-status');
  if (!el) return;
  el.textContent = msg || '';
  el.className = 'status' + (kind ? ' ' + kind : '');
}

async function reloadRules() {
  const r = await (await fetch('/__proxy/api/rules')).json();
  const ta = $('rules-json');
  const text = JSON.stringify(r.stored ?? r.config, null, 2);
  if (ta) {
    ta.value = text;
    rulesEditorBaseline = text;
    ta.classList.remove('dirty');
  }
  setRulesStatus('Loaded from ' + (r.source || 'unknown'), 'ok');
  // Sync the routing mode quick-toggle indicator + prefill from/to inputs from current rules.
  syncRoutingModeUI(r.config || {});
}

function detectRoutingMode(cfg) {
  const sr = cfg.shadow_router || {};
  const mr = cfg.model_router || {};
  if (sr.enabled && (sr.rules || []).length > 0) return 'shadow';
  if (mr.enabled && (mr.rules || []).length > 0) return 'redirect';
  return 'passthrough';
}

function _firstRoutingPair(cfg) {
  for (const r of (cfg.shadow_router?.rules || [])) {
    const fm = r?.if?.from_model;
    if (fm && r.shadow_to) return { from: Array.isArray(fm) ? fm[0] : fm, to: r.shadow_to };
  }
  for (const r of (cfg.model_router?.rules || [])) {
    const fm = r?.if?.from_model;
    if (fm && r.then) return { from: Array.isArray(fm) ? fm[0] : fm, to: r.then };
  }
  return null;
}

function syncRoutingModeUI(cfg) {
  const mode = detectRoutingMode(cfg);
  for (const m of ['passthrough', 'shadow', 'redirect']) {
    const btn = $('mode-btn-' + m);
    if (btn) btn.classList.toggle('active', m === mode);
  }
  const pair = _firstRoutingPair(cfg);
  if (pair) {
    const fromEl = $('routing-from');
    const toEl = $('routing-to');
    if (fromEl && !fromEl.dataset.userEdited) fromEl.value = pair.from;
    if (toEl && !toEl.dataset.userEdited) toEl.value = pair.to;
  }
  const labels = {
    passthrough: 'Passthrough — Anthropic requests go straight to api.anthropic.com',
    shadow: 'Shadow — primary still goes to Anthropic; local model runs in parallel for comparison',
    redirect: 'Redirect — Anthropic requests are translated and sent to the local model',
  };
  const status = $('routing-status');
  if (status) status.textContent = 'Active: ' + (labels[mode] || mode);
}

async function setRoutingMode(mode) {
  const fromEl = $('routing-from');
  const toEl = $('routing-to');
  if (fromEl) fromEl.dataset.userEdited = '1';
  if (toEl) toEl.dataset.userEdited = '1';
  const from = (fromEl?.value || '').trim();
  const to = (toEl?.value || '').trim();
  if ((mode === 'shadow' || mode === 'redirect') && (!from || !to)) {
    setRulesStatus('Set both From and To models first', 'err');
    return;
  }
  // Pull current effective config to merge with — preserves any unrelated rule settings.
  const r = await (await fetch('/__proxy/api/rules')).json();
  const cfg = JSON.parse(JSON.stringify(r.stored ?? r.config ?? {}));
  if (mode === 'shadow') {
    cfg.shadow_router = { enabled: true, rules: [{ if: { from_model: from }, shadow_to: to }] };
    cfg.model_router = { ...(cfg.model_router || {}), enabled: false };
  } else if (mode === 'redirect') {
    cfg.model_router = {
      ...(cfg.model_router || {}),
      enabled: true,
      aliases: cfg.model_router?.aliases || {},
      rules: [{ if: { from_model: from }, then: to }],
    };
    cfg.shadow_router = { ...(cfg.shadow_router || {}), enabled: false };
  } else {
    cfg.shadow_router = { ...(cfg.shadow_router || {}), enabled: false };
    cfg.model_router = { ...(cfg.model_router || {}), enabled: false };
  }
  const resp = await fetch('/__proxy/api/rules', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(cfg),
  });
  if (!resp.ok) {
    let msg = 'Save failed (' + resp.status + ')';
    try { msg = (await resp.json()).error || msg; } catch {}
    setRulesStatus(msg, 'err');
    return;
  }
  setRulesStatus('Routing mode → ' + mode, 'ok');
  await reloadRules();
}

async function saveRules() {
  const ta = $('rules-json');
  if (!ta) return;
  let parsed;
  try { parsed = JSON.parse(ta.value); }
  catch (e) { setRulesStatus('Invalid JSON: ' + e.message, 'err'); return; }
  if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) {
    setRulesStatus('Top-level must be a JSON object', 'err'); return;
  }
  const r = await fetch('/__proxy/api/rules', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(parsed),
  });
  if (!r.ok) {
    let msg = 'Save failed (' + r.status + ')';
    try { msg = (await r.json()).error || msg; } catch {}
    setRulesStatus(msg, 'err');
    return;
  }
  rulesEditorBaseline = ta.value;
  ta.classList.remove('dirty');
  setRulesStatus('Saved · effective immediately', 'ok');
  loadAudit();  // refresh active-rules section + suggestions
}

async function resetRules() {
  if (!confirm('Reset rules to defaults? Your saved config will be removed.')) return;
  await fetch('/__proxy/api/rules/reset', { method: 'POST' });
  await reloadRules();
  setRulesStatus('Reset to defaults', 'ok');
  loadAudit();
}

async function toggleRule(name, enabled) {
  // Quick-toggle: read current stored config, flip the enabled flag, save back.
  const r = await (await fetch('/__proxy/api/rules')).json();
  const stored = r.stored && typeof r.stored === 'object' ? r.stored : {};
  if (!stored[name] || typeof stored[name] !== 'object') stored[name] = {};
  stored[name].enabled = enabled;
  // Preserve any defaults the user hadn't overridden by merging registered rule's existing config.
  const cfg = (r.config && r.config[name]) || {};
  for (const k of Object.keys(cfg)) {
    if (!(k in stored[name])) stored[name][k] = cfg[k];
  }
  stored[name].enabled = enabled;
  await fetch('/__proxy/api/rules', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(stored),
  });
  loadAudit();
}

function ollamaConfigSection(ollama) {
  const env = ollama.env || {};
  const keys = Object.keys(env).sort();
  if (!ollama.pid && !keys.length && !ollama.version) return '';
  const envRows = keys.length
    ? keys.map(k => `<tr><td><code>${esc(k)}</code></td><td><code style="font-size:11px">${esc(env[k])}</code></td></tr>`).join('')
    : `<tr><td colspan="2" class="empty" style="padding:8px">Couldn't read OLLAMA_* env vars. The proxy isn't the same user as the ollama process and the systemd unit lookup also failed. Set <code>OLLAMA_SYSTEMD_UNIT</code> on the proxy if your unit name isn't <code>ollama.service</code>.</td></tr>`;
  const meta = [
    ollama.version ? 'v' + ollama.version : null,
    ollama.pid ? 'pid ' + ollama.pid : null,
    ollama.env_source ? 'from ' + ollama.env_source : null,
  ].filter(Boolean).join(' · ');
  return `
    <details class="stats-section" open>
      <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;margin:0 0 8px 0">
        <span style="color:#888;font-size:10px;width:10px">▾</span>
        <h2 style="margin:0">Ollama Server Config <span style="color:#666;font-weight:normal;font-size:11px">${esc(meta)}</span></h2>
      </summary>
      <table style="width:100%">
        <thead><tr><th>Variable</th><th>Value</th></tr></thead>

}

function sparklinePath(values, w, h) {
  // values: array of numbers (may include null). Returns {line, fill, max, min, last}.
  const clean = values.map(v => (v == null || isNaN(v)) ? null : Number(v));
  const valid = clean.filter(v => v != null);
  if (!valid.length) return { line: '', fill: '', max: 0, min: 0, last: null };
  const max = Math.max(...valid);
  const min = Math.min(...valid);
  const range = max - min || 1;
  const n = clean.length;
  const stepX = n > 1 ? w / (n - 1) : w;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const v = clean[i];
    if (v == null) continue;
    const x = i * stepX;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    pts.push([x, y]);
  }
  if (!pts.length) return { line: '', fill: '', max, min, last: null };
  let line = 'M' + pts.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' L');
  let fill = `M${pts[0][0].toFixed(1)} ${h} L` + pts.map(p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' L') + ` L${pts[pts.length-1][0].toFixed(1)} ${h} Z`;
  return { line, fill, max, min, last: clean[clean.length - 1] };
}

function spark(values, label, unit) {
  const w = 280, h = 60;
  const sp = sparklinePath(values, w, h);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path class="fill" d="${sp.fill}"/>
    <path class="line" d="${sp.line}"/>
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:10px;color:#666">
    <span>min ${sp.min == null ? '—' : Math.round(sp.min)}${unit||''}</span>
    <span>max ${sp.max == null ? '—' : Math.round(sp.max)}${unit||''}</span>
  </div>`;
}

function barClass(pct) {
  if (pct >= 90) return 'crit';
  if (pct >= 70) return 'warn';
  return '';
}

let systemHistoryCache = null;
let systemNowCache = null;
let systemHealthCache = null;

function fmtBytes(n) {
  if (n == null) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
  return (n / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
}

        <button onclick="resetDb(this)" style="background:#4a2e2e;color:#e08080;border:1px solid #6a3030;padding:4px 14px;border-radius:3px;cursor:pointer;font-size:12px">Wipe selected</button>

async function resetDb(btn) {
  const targets = [];
  if ($('reset-requests').checked) targets.push('requests');
  if ($('reset-metrics').checked) targets.push('metrics');
  if ($('reset-settings').checked) targets.push('settings');
  if (!targets.length) { alert('Select at least one target.'); return; }
  const msg = `This will permanently delete: ${targets.join(', ')}. Continue?`;
  if (!confirm(msg)) return;
  const orig = btn.textContent;
  btn.textContent = '…';
  btn.disabled = true;
  try {
    const r = await fetch('/__proxy/api/db/reset', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ targets, vacuum: $('reset-vacuum').checked }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    btn.textContent = '✓ wiped';
    btn.style.background = '#2e4a2e';
    btn.style.color = '#a3be8c';
    btn.style.borderColor = '#4a6a4a';
    setTimeout(() => loadSystem(), 500);
  } catch (e) {
    btn.textContent = '✗ ' + e.message;
  } finally {
    setTimeout(() => {
      btn.textContent = orig;
      btn.style.background = '';
      btn.style.color = '';
      btn.style.borderColor = '';
      btn.disabled = false;
    }, 2000);
  }
}

async function restartProxy(btn) {
  const status = $('restart-status');
  const wasManaged = (systemHealthCache && systemHealthCache.process && systemHealthCache.process.managed_by_systemd);
  const oldPid = systemHealthCache && systemHealthCache.process && systemHealthCache.process.pid;
  const warn = wasManaged
    ? 'Restart the proxy now? In-flight requests will be terminated; systemd will relaunch it within ~1s.'
    : 'Restart the proxy now? This process is NOT managed by systemd — exiting will stop the proxy entirely until you start it manually.';
  if (!confirm(warn)) return;
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '↻ restarting…';
  status.textContent = '';
  try {
    const r = await fetch('/__proxy/api/restart', {
      method: 'POST',
      headers: { 'x-confirm': 'restart-now' },
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error || ('HTTP ' + r.status));
    }
    status.textContent = 'sent — waiting for proxy to come back…';
    // Poll health until we see a different PID (or any successful response if old PID unknown).
    const deadline = Date.now() + 15000;
    let backOnline = false;
    while (Date.now() < deadline) {
      await new Promise(res => setTimeout(res, 600));
      try {
        const hp = await fetch('/__proxy/api/health').then(r => r.ok ? r.json() : null);
        const newPid = hp && hp.process && hp.process.pid;
        if (newPid && (!oldPid || newPid !== oldPid)) {
          backOnline = true;
          break;
        }
      } catch {}
    }
    if (backOnline) {
      btn.textContent = '✓ restarted';
      btn.style.background = '#2e4a2e';
      btn.style.color = '#a3be8c';
      btn.style.borderColor = '#4a6a4a';
      status.textContent = 'proxy is back';
      loadSystem();
    } else {
      btn.textContent = '? no response';
      btn.style.background = '#4a2e2e';
      btn.style.color = '#e08080';
      status.textContent = wasManaged
        ? 'Proxy did not come back within 15s — check systemctl status ai_proxy'
        : 'Proxy exited but no supervisor restarted it. Run it again manually.';
    }
  } catch (e) {
    btn.textContent = '✗ ' + e.message;
    btn.style.background = '#4a2e2e';
    btn.style.color = '#e08080';
  } finally {
    setTimeout(() => {
      btn.textContent = orig;
      btn.style.background = '';
      btn.style.color = '';
      btn.style.borderColor = '';
      btn.disabled = false;
    }, 4000);
  }
}

async function loadSystem() {
  const [now, hist, hp] = await Promise.all([
    fetch('/__proxy/api/system/now').then(r => r.json()),
    fetch('/__proxy/api/system/history?minutes=60').then(r => r.json()),
    fetch('/__proxy/api/health').then(r => r.json()).catch(() => null),
  ]);
  systemNowCache = now;
  systemHistoryCache = hist;
  systemHealthCache = hp;
  renderSystem();
}

function renderSystem() {
  const now = systemNowCache;
  const hist = systemHistoryCache;
  if (!now || !hist) return;

  const samples = hist.samples || [];
  if (!now.ts) {
    $('system').innerHTML = '<div class="empty" style="padding:40px">Collecting first metrics — refresh in a few seconds…</div>';
    return;
  }

  const cpuVals = samples.map(s => s.cpu_pct);
  const memVals = samples.map(s => s.mem_used_mb && s.mem_total_mb ? (s.mem_used_mb / s.mem_total_mb * 100) : null);
  const gpuUtilVals = samples.map(s => s.gpu_util_pct);
  const gpuMemVals = samples.map(s => s.gpu_mem_used_mb && s.gpu_mem_total_mb ? (s.gpu_mem_used_mb / s.gpu_mem_total_mb * 100) : null);

  const cpu = now.cpu_pct;
  const mem = now.mem || {};
  const memPct = mem.total_mb ? (mem.used_mb / mem.total_mb * 100) : null;
  const gpus = now.gpus || [];

  const cpuCard = `<div class="gauge">
    <div class="l">CPU</div>
    <div class="v">${cpu == null ? '—' : cpu.toFixed(1)}<span style="font-size:14px;color:#888">%</span></div>
    <div class="s">load 1m: ${now.load_1m == null ? '—' : now.load_1m.toFixed(2)}</div>
    <div class="bar-bg"><div class="bar-fg ${barClass(cpu || 0)}" style="width:${cpu == null ? 0 : cpu}%"></div></div>
    ${spark(cpuVals, 'cpu', '%')}
  </div>`;

  const memCard = `<div class="gauge">
    <div class="l">Memory</div>
    <div class="v">${mem.used_mb == null ? '—' : (mem.used_mb / 1024).toFixed(1)}<span style="font-size:14px;color:#888"> / ${mem.total_mb == null ? '—' : (mem.total_mb / 1024).toFixed(1)} GB</span></div>
    <div class="s">${memPct == null ? '' : memPct.toFixed(0) + '% used · '} avail ${mem.avail_mb == null ? '—' : (mem.avail_mb / 1024).toFixed(1)} GB</div>
    <div class="bar-bg"><div class="bar-fg ${barClass(memPct || 0)}" style="width:${memPct == null ? 0 : memPct}%"></div></div>
    ${spark(memVals, 'mem', '%')}
  </div>`;

  const gpuCards = gpus.map((g, i) => {
    const util = g.util_pct;
    const memUsed = g.mem_used_mb;
    const memTotal = g.mem_total_mb;
    const gpuMemPct = (memUsed && memTotal) ? (memUsed / memTotal * 100) : null;
    const procs = (g.processes || []).slice(0, 6).map(p => `<span class="pid"><code>${esc(String(p.pid))}</code> ${esc(p.name || '')} <span style="color:#666">${num(p.mem_mb || 0)}MB</span></span>`).join('');
    const utilSpark = i === 0 ? spark(gpuUtilVals, 'gpu', '%') : '';
    const unifiedTag = g.unified ? ' <span class="badge" title="Unified memory: GPU shares system RAM (e.g. DGX Spark / GB10)">unified</span>' : '';
    const memLabel = g.unified ? 'GPU mem (shared)' : 'VRAM';
    return `<div class="gauge">
      <div class="l">GPU ${g.idx}: ${esc(g.name || '')}${unifiedTag}</div>
      <div class="v">${util == null ? '—' : util}<span style="font-size:14px;color:#888">% util</span> <span style="font-size:13px;color:#888">· ${g.temp_c == null ? '' : g.temp_c + '°C'}</span></div>
      <div class="s">${memLabel} ${memUsed == null ? '—' : (memUsed/1024).toFixed(1)} / ${memTotal == null ? '—' : (memTotal/1024).toFixed(1)} GB${gpuMemPct ? ' · ' + gpuMemPct.toFixed(0) + '%' : ''}</div>
      <div class="bar-bg"><div class="bar-fg ${barClass(gpuMemPct || 0)}" style="width:${gpuMemPct == null ? 0 : gpuMemPct}%"></div></div>
      ${utilSpark}
      ${procs ? `<div class="pid-list">${procs}</div>` : ''}
    </div>`;
  }).join('') || `<div class="gauge"><div class="l">GPU</div><div class="v" style="font-size:14px;color:#888">No NVIDIA GPU detected</div></div>`;

  const ollama = now.ollama || {};
  const lmstudio = now.lmstudio || {};

  const ollamaPs = (ollama.ps || []).map(m => `
    <tr><td><code>${esc(m.name || m.model || '')}</code></td>
        <td>${esc(m.parameter_size || '')}</td>
        <td class="num">${num(m.size_mb || 0)} MB</td>
        <td class="num">${num(m.size_vram_mb || 0)} MB</td>
        <td>${m.expires_at ? esc(new Date(m.expires_at).toLocaleTimeString()) : ''}</td></tr>
  `).join('') || '<tr><td colspan="5" class="empty" style="padding:8px">No models loaded</td></tr>';

  const ollamaTags = (ollama.tags || []).slice(0, 25).map(m => `
    <tr><td><code>${esc(m.name || '')}</code></td><td>${esc(m.parameter_size || '')}</td><td class="num">${num(m.size_mb || 0)} MB</td></tr>
  `).join('') || '<tr><td colspan="3" class="empty" style="padding:8px">No models</td></tr>';

  const lmsLoaded = (lmstudio.loaded || []).map(m => `
    <tr><td><code>${esc(m.id || '')}</code></td>
        <td>${esc(m.type || '')}</td>
        <td>${esc(m.arch || '')}</td>
        <td>${esc(m.quant || '')}</td>
        <td class="num">${m.loaded_context_length ? num(m.loaded_context_length) : ''}${m.max_context_length ? ' / ' + num(m.max_context_length) : ''}</td></tr>
  `).join('') || '<tr><td colspan="5" class="empty" style="padding:8px">No models loaded</td></tr>';

  const lmsAvailable = (lmstudio.available || []).slice(0, 25).map(m => `
    <tr><td><code>${esc(m.id || '')}</code></td><td>${esc(m.type || '')}</td><td>${esc(m.state || '')}</td></tr>
  `).join('') || '<tr><td colspan="3" class="empty" style="padding:8px">No models</td></tr>';

  $('system').innerHTML = `
    ${renderProxyHealth(systemHealthCache)}
    <div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">
      ${cpuCard}
      ${memCard}
      ${gpuCards}
    </div>

    <div class="stats-section">
      <h2><span class="reach-dot ${ollama.reachable ? 'ok' : 'bad'}"></span>Ollama Loaded Models <span style="color:#888;font-weight:normal;font-size:11px">${esc(now.ts ? new Date(now.ts*1000).toLocaleTimeString() : '')}</span></h2>
      <table style="width:100%">
        <thead><tr><th>Name</th><th>Params</th><th class="num">Size</th><th class="num">VRAM</th><th>Expires</th></tr></thead>
        <tbody>${ollamaPs}</tbody>
      </table>
    </div>

    ${ollamaConfigSection(ollama)}

    <div class="stats-section">
      <h2><span class="reach-dot ${lmstudio.reachable ? 'ok' : 'bad'}"></span>LM Studio Loaded Models</h2>
      <table style="width:100%">
        <thead><tr><th>ID</th><th>Type</th><th>Arch</th><th>Quant</th><th class="num">Context</th></tr></thead>
        <tbody>${lmsLoaded}</tbody>
      </table>
    </div>

    <div class="stats-section">
      <h2>Ollama Available (top 25)</h2>
      <table style="width:100%">
        <thead><tr><th>Name</th><th>Params</th><th class="num">Size</th></tr></thead>
        <tbody>${ollamaTags}</tbody>
      </table>
    </div>

    <div class="stats-section">
      <h2>LM Studio Available (top 25)</h2>
      <table style="width:100%">
        <thead><tr><th>ID</th><th>Type</th><th>State</th></tr></thead>
        <tbody>${lmsAvailable}</tbody>
      </table>
    </div>
  `;
}

async function loadSetup() {
  const baseRoot = window.location.origin;
  const base = baseRoot + '/v1';

  // Pull the model list through the proxy itself so we get whatever upstream offers.
  let models = [];
  try {
    const r = await fetch(base + '/models');
    if (r.ok) {
      const d = await r.json();
      models = (d.data || []).map(m => m.id).filter(Boolean);
    }
  } catch {}
  if (!models.length) models = ['<your-model>'];

  if (!setupSelectedModel || !models.includes(setupSelectedModel)) {
    setupSelectedModel = models[0];
  }

  const modelOpts = models.map(m => `<option value="${esc(m)}" ${m === setupSelectedModel ? 'selected' : ''}>${esc(m)}</option>`).join('');

  const snippets = setupSubTab === 'mcp'
    ? mcpSnippets(baseRoot)
    : apiSnippets(base, baseRoot, setupSelectedModel);
  const snippetsHtml = snippets.map((s, i) => `
    <div class="snippet">
      <div class="snippet-head">
        <h4>${esc(s.title)}</h4>
        <span class="desc">${esc(s.desc || '')}</span>
        <button onclick="copySnippet(${i}, this)">Copy</button>
      </div>
      <pre id="snip-${i}">${esc(s.code)}</pre>
    </div>
  `).join('');

  // Stash for the copy button.
  window._setupSnippets = snippets;

  const mcpUrl = baseRoot + '/__proxy/mcp';
  const apiVarsHtml = `
    <div><span class="label">Base URL</span> <code>${esc(base)}</code> <button onclick="copyText('${esc(base)}', this)" style="background:#2a2e3a;color:#e6e6e6;border:1px solid #3a3e4a;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px">copy</button></div>
    <div><span class="label">Ollama URL</span> <code>${esc(baseRoot)}</code> <span style="color:#666;font-size:11px">(for clients using Ollama-native API, not /v1)</span></div>
    <div><span class="label">API Key</span> <code>ollama</code> <span style="color:#666;font-size:11px">(any non-empty string — proxy passes it to upstream)</span></div>
    <div><span class="label">Model</span> <select id="setup-model" onchange="setupSelectedModel = this.value; loadSetup();">${modelOpts}</select> <span style="color:#666;font-size:11px">${num(models.length)} model${models.length === 1 ? '' : 's'} available</span></div>
  `;
  const mcpVarsHtml = `
    <div><span class="label">MCP URL</span> <code>${esc(mcpUrl)}</code> <button onclick="copyText('${esc(mcpUrl)}', this)" style="background:#2a2e3a;color:#e6e6e6;border:1px solid #3a3e4a;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:11px">copy</button></div>
    <div><span class="label">Transport</span> <code>streamable-http</code> <span style="color:#666;font-size:11px">(JSON-RPC 2.0 over HTTP POST)</span></div>
    <div><span class="label">Auth</span> <span style="color:#666;font-size:11px">none unless <code>MCP_API_KEY</code> is set on the proxy</span></div>
    <div><span class="label">Tools</span> <span style="color:#666;font-size:11px">list_recent_requests, get_request_detail, list_conversations, get_conversation, get_stats, get_audit, get_suggestions, get_rules, get_system_metrics, export_digest <span style="color:#666">(+ update_rules when MCP_ALLOW_WRITE=true)</span></span></div>
  `;

  $('setup').innerHTML = `
    <h2 style="margin:0 0 6px 0;font-size:14px">Connect IDEs and tools</h2>
    <p style="color:#888;font-size:12px;margin:0 0 12px 0">Two ways to wire the proxy into AI tools: as an OpenAI-compatible API endpoint (model traffic flows through it), or as an MCP server (an AI can call it as a tool to inspect its own traffic and tune rules).</p>
    <div class="tabs" style="margin-bottom:14px">
      <button class="tab ${setupSubTab === 'api' ? 'active' : ''}" onclick="setSetupSubTab('api')">OpenAI API</button>
      <button class="tab ${setupSubTab === 'mcp' ? 'active' : ''}" onclick="setSetupSubTab('mcp')">MCP Server</button>
    </div>
    <div class="setup-vars">
      ${setupSubTab === 'mcp' ? mcpVarsHtml : apiVarsHtml}
    </div>
    ${snippetsHtml}
  `;
}

async function exportDigest(format, btn) {
  const samples = parseInt($('export-samples').value, 10) || 0;
  const minutes = parseInt($('export-minutes').value, 10) || 1440;
  const redact = $('export-redact').checked;
  const bodies = $('export-bodies').checked;
  const url = `/__proxy/api/export?format=${format}&samples=${samples}&minutes=${minutes}&include_bodies=${bodies}&redact=${redact}`;
  const orig = btn.textContent;
  btn.textContent = '…';
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    if (format === 'markdown') {
      const text = await blob.text();
      await navigator.clipboard.writeText(text);
      btn.textContent = '✓ copied';
      btn.classList.add('ok');
    } else {
      const ext = format === 'json' ? 'json' : 'ndjson';
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `ai-proxy-export-${Date.now()}.${ext}`;
      link.click();
      URL.revokeObjectURL(link.href);
      btn.textContent = '✓ downloaded';
      btn.classList.add('ok');
    }
  } catch (e) {
    btn.textContent = '✗ ' + e.message;
  }
  setTimeout(() => { btn.textContent = orig; btn.classList.remove('ok'); }, 1500);
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = '✓ copied';
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('ok'); }, 1200);
    }
  } catch (e) {
    alert('Copy failed: ' + e.message);
  }
}

async function copySnippet(i, btn) {
  const snippets = window._setupSnippets || [];
  const s = snippets[i];
  if (!s) return;
  await copyText(s.code, btn);
}

async function refreshAuditBadge() {
  try {
    const a = await (await fetch('/__proxy/api/audit?include_allow=false&limit=1')).json();
    const blocks = (a.counts && a.counts.block) || 0;
    const warns = (a.counts && a.counts.warn) || 0;
    const total = blocks + warns;
    const b = $('audit-badge');
    if (total > 0) { b.textContent = total; b.style.display = 'inline'; }
    else { b.style.display = 'none'; }
  } catch {}
}

function fmtSpan(s) {
  if (s < 60) return `${Math.round(s)}s`;
  if (s < 3600) return `${(s/60).toFixed(1)}m`;
  if (s < 86400) return `${(s/3600).toFixed(1)}h`;
  return `${(s/86400).toFixed(1)}d`;
}

setInterval(() => {
  if (!$('autoref').checked) return;
  if (view === 'stats') loadStats();
  else if (view === 'audit') loadAudit();
  else if (view === 'convs') { /* don't auto-reload conversation detail; respect current view */ }
  else if (view === 'system') loadSystem();
  else refresh();
  refreshAuditBadge();
}, 1500);
loadInfo();
refresh();
refreshAuditBadge();
</script>
