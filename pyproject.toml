[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guscatalano-ai-proxy"
dynamic = ["version"]
description = "A transparent inspector and rule engine that sits between AI clients and their upstreams."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Gus Catalano" }]
keywords = ["llm", "proxy", "anthropic", "openai", "ollama", "observability", "claude", "inspector"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.urls]
Homepage = "https://github.com/guscatalano/AI_Proxy"
Issues = "https://github.com/guscatalano/AI_Proxy/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ai_proxy --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["ai_proxy"]
omit = ["ai_proxy/__main__.py"]

[tool.coverage.report]
# The bulk of proxy.py is request-forwarding/UI plumbing exercised only against a live
# upstream, so we don't enforce a global threshold — the report is informational, with
# the translation/state/version logic being the meaningfully covered surface.
show_missing = true
skip_covered = false

[project.scripts]
ai-proxy = "ai_proxy:main"

[tool.setuptools]
packages = ["ai_proxy"]

[tool.setuptools.dynamic]
version = { attr = "ai_proxy._version.__version__" }

[tool.setuptools.package-data]
ai_proxy = ["static/*", "static/**/*"]
